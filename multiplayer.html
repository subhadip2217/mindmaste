<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Master — Multiplayer Arena</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:radial-gradient(circle at 15% 10%,#8b5cf633,transparent 30%),radial-gradient(circle at 85% 15%,#06b6d422,transparent 28%),#03050b;color:#f8fafc;font:15px system-ui;min-height:100vh}.wrap{max-width:1150px;margin:auto;padding:22px}.glass{background:#ffffff08;border:1px solid #ffffff18;border-radius:22px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 20px 70px #0008}.hero{text-align:center}.hero h1{font-size:clamp(35px,7vw,68px);margin:5px 0;background:linear-gradient(100deg,#fff,#c4b5fd,#67e8f9);color:transparent;background-clip:text}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.game{cursor:pointer;min-height:145px;transition:.2s}.game:hover,.game.selected{transform:translateY(-3px);border-color:#22d3ee88;box-shadow:0 0 30px #8b5cf622}.game.selected{background:linear-gradient(145deg,#8b5cf622,#06b6d411)}.icon{font-size:31px}.game h3{margin:8px 0 4px}.tag{display:inline-block;font-size:10px;padding:4px 8px;border-radius:99px;background:#8b5cf622;color:#c4b5fd}.btn,input{padding:12px 15px;border-radius:12px;border:1px solid #ffffff20;background:#ffffff0a;color:#fff}.btn{cursor:pointer;font-weight:700}.primary{background:linear-gradient(100deg,#8b5cf6,#06b6d4);border:0}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{margin:12px 0}.good{color:#34d399}.bad{color:#fb7185}.gameplay{margin-top:16px}.q{font-size:48px;text-align:center;margin:25px}.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choice{min-width:110px}.race{height:180px;position:relative;background:#ffffff05;border-radius:18px;margin:15px 0;overflow:hidden}.track{position:absolute;left:35px;right:35px;top:83px;height:7px;background:#ffffff15}.runner{position:absolute;left:0;top:50px;font-size:29px;transition:left .3s;filter:drop-shadow(0 0 10px #22d3ee)}.runner.b{top:108px;filter:drop-shadow(0 0 10px #ec4899)}.finish{position:absolute;right:20px;top:53px;font-size:42px}.center{text-align:center}.hidden{display:none}@media(max-width:700px){.wrap{padding:12px}.q{font-size:34px}.actions>*{width:100%}}</style></head><body><main class="wrap"><header class="glass hero"><div>🌌 AURA BRAIN ARENA</div><h1>MIND MASTER</h1><p class="muted">Train your mind. Challenge your friend. Improve every day.</p></header><section class="glass" style="margin-top:15px"><h2>🎮 Choose your multiplayer game</h2><p class="muted">Select a game first, then create a room. Your friend will play the same game.</p><div id="games" class="grid"></div></section><section class="glass" style="margin-top:15px"><h2>⚔️ Room</h2><div class="actions"><input id="name1" placeholder="Your name"><button class="btn primary" onclick="createRoom()">CREATE ROOM</button><input id="code" placeholder="ROOM CODE"><input id="name2" placeholder="Your name"><button class="btn" onclick="joinRoom()">JOIN ROOM</button></div><div id="status" class="status">Connecting…</div><div id="roomInfo"></div></section><section id="game" class="glass gameplay hidden"></section></main><script>
const CONFIG={SUPABASE_URL:'https://cpursknrmguwxglnzgke.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_CIA6kWSUS7A7-YINdeocVw_SI7I9utS'};
const GAMES=[['math','🏁','Math Rush','Calculation','Race your friend with fast mental arithmetic.'],['memory','🧠','Memory Battle','Memory','Remember glowing tiles and reproduce them.'],['numbers','🔢','Number Recall Duel','Memory','Memorize longer number sequences under pressure.'],['reaction','⚡','Reaction Duel','Reaction','React faster and keep your timing consistent.'],['logic','🧩','Logic Duel','Deduction','Solve reasoning, syllogism and odd-one-out challenges.'],['focus','🔍','Focus Hunt Duel','Attention','Find the target among distractions.'],['sequence','🔄','Sequence Duel','Pattern','Predict numerical and symbolic patterns.'],['target','🎯','Target Shift Duel','Flexibility','Follow changing rules quickly.'],['spatial','🧱','Spatial Duel','Spatial','Solve mental-rotation challenges.']];
let selected='math',sb,room=null,me='',pid='',sub=null,round=0,progress=0,opp=0,combo=0,started=false,roundStart=0,answered=false;
const gameMap=Object.fromEntries(GAMES.map(g=>[g[0],g]));document.getElementById('games').innerHTML=GAMES.map(g=>`<article class="glass game ${g[0]==='math'?'selected':''}" data-game="${g[0]}" onclick="selectGame('${g[0]}')"><div class="icon">${g[1]}</div><span class="tag">${g[3]}</span><h3>${g[2]}</h3><p class="muted">${g[4]}</p></article>`).join('');
function selectGame(g){if(room)return;selected=g;document.querySelectorAll('.game').forEach(x=>x.classList.toggle('selected',x.dataset.game===g));showStatus('Selected: '+gameMap[g][2]);}
function ready(){if(!window.supabase){showStatus('Supabase library failed to load.');return false}if(!sb)sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false}});showStatus('🟢 Supabase connected');return true}function showStatus(x){document.getElementById('status').innerHTML=x}function makeCode(){return Math.random().toString(36).slice(2,7).toUpperCase()}
async function createRoom(){if(!ready())return;me=document.getElementById('name1').value.trim()||'Player 1';pid=crypto.randomUUID();let c=makeCode();let {data,error}=await sb.from('mm_rooms').insert({room_code:c,game_type:selected,player1_id:pid,player1_name:me,status:'WAITING'}).select().single();if(error){showStatus('❌ '+error.message);return}room=data;localStorage.mmPlayer=pid;await subscribe();showRoom()}
async function joinRoom(){if(!ready())return;me=document.getElementById('name2').value.trim()||'Player 2';let c=document.getElementById('code').value.trim().toUpperCase();pid=crypto.randomUUID();let {data,error}=await sb.from('mm_rooms').select('*').eq('room_code',c).gt('expires_at',new Date().toISOString()).single();if(error||!data){showStatus('❌ Room not found or expired.');return}if(data.player2_id){showStatus('❌ Room is full.');return}if(data.status!=='WAITING'){showStatus('❌ Match has already started.');return}let up=await sb.from('mm_rooms').update({player2_id:pid,player2_name:me}).eq('id',data.id).is('player2_id',null);if(up.error){showStatus('❌ '+up.error.message);return}room={...data,player2_id:pid,player2_name:me};localStorage.mmPlayer=pid;selected=room.game_type;document.querySelectorAll('.game').forEach(x=>x.classList.toggle('selected',x.dataset.game===selected));await subscribe();showRoom()}
async function subscribe(){if(sub)await sb.removeChannel(sub);sub=sb.channel('mm-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'mm_rooms',filter:'id=eq.'+room.id},p=>{if(p.new){room=p.new;showRoom();if(room.status==='PLAYING'&&!started)startMatch(false);if(room.status==='COUNTDOWN')countdown();}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'mm_events',filter:'room_id=eq.'+room.id},p=>handleEvent(p.new)).subscribe(s=>{if(s==='SUBSCRIBED')showStatus('🟢 Realtime connected • '+gameMap[selected][2])})}
function showRoom(){let opponent=room.player1_id&&room.player2_id?(room.player1_id===pid?room.player2_name:room.player1_name):'Waiting for friend…';document.getElementById('roomInfo').innerHTML=`<div class="glass" style="margin-top:15px"><h2>Room <b>${room.room_code}</b></h2><p>🎮 Game: <b>${gameMap[room.game_type]?.[2]||room.game_type}</b></p><p>👤 You: ${me}</p><p>👥 Opponent: ${opponent}</p><p>Status: <b>${room.status}</b></p>${room.player2_id&&room.status==='WAITING'?'<button class="btn primary" onclick="readyUp()">READY</button>':''}${room.status==='READY'?'<p class="good">Both players are connected. Get ready…</p>':''}</div>`}
async function readyUp(){await send('ready',{name:me});let {data}=await sb.from('mm_events').select('player_id').eq('room_id',room.id).eq('event_type','ready');if(data&&new Set(data.map(x=>x.player_id)).size>=2){await sb.from('mm_rooms').update({status:'COUNTDOWN'}).eq('id',room.id);await send('countdown',{at:Date.now()+3500})}}
async function send(type,payload){return sb.from('mm_events').insert({room_id:room.id,player_id:pid,event_type:type,payload})}function handleEvent(e){if(e.player_id===pid)return;if(e.event_type==='answer'||e.event_type==='reaction'){opp=Math.min(100,opp+Number(e.payload.progress||0));renderRace()}if(e.event_type==='finish'){finish(false)}}
let countdownStarted=false;function countdown(){if(countdownStarted||started)return;countdownStarted=true;let n=3;document.getElementById('game').classList.remove('hidden');document.getElementById('game').innerHTML=`<div class="center"><h1 id="count">3</h1><p>GET READY</p></div>`;let timer=setInterval(()=>{n--;if(n<=0){clearInterval(timer);countdownStarted=false;started=false;startMatch(true)}else document.getElementById('count').textContent=n},1000)}
function startMatch(local){if(started)return;started=true;round=0;progress=0;opp=0;combo=0;if(local)sb.from('mm_rooms').update({status:'PLAYING'}).eq('id',room.id);setTimeout(nextRound,300)}
function seed(){let s=0;for(let i=0;i<room.id.length;i++)s=(s*31+room.id.charCodeAt(i)+round*97)>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function nextRound(){if(!started)return;if(round>=10){finish(true);return}round++;answered=false;let g=room.game_type;if(g==='math')mathRound();else if(g==='numbers')numberRound();else if(g==='reaction')reactionRound();else if(g==='memory')memoryRound();else if(g==='logic')logicRound();else if(g==='focus')focusRound();else if(g==='sequence')sequenceRound();else if(g==='target')targetRound();else spatialRound()}
function shell(content){document.getElementById('game').innerHTML=`<h2>${gameMap[room.game_type][1]} ${gameMap[room.game_type][2]} <span class="tag">Round ${round}/10</span></h2><div class="race"><div class="track"></div><div class="runner" style="left:${progress}%">🏃</div><div class="runner b" style="left:${opp}%">🏃</div><div class="finish">🏁</div></div>${content}<p id="raceStatus" class="center">YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}% • 🔥 ${combo} COMBO</p>`;roundStart=performance.now()}
function opts(answer,wrong1,wrong2,wrong3){return [answer,wrong1,wrong2,wrong3].sort(()=>Math.random()-.5)}function mathRound(){let r=seed(),a=3+Math.floor(r()*12),b=2+Math.floor(r()*10),ans=a*b;shell(`<div class="q">${a} × ${b} = ?</div><div class="choices">${opts(ans,ans+b,ans-2,ans+3).map(x=>`<button class="btn choice" onclick="submitAnswer(${x},${ans})">${x}</button>`).join('')}</div><p class="center">${round>=7?'🔥 RISK ROUND — harder question':''}</p>`)}
function submitAnswer(v,a){if(answered)return;answered=true;let ms=Math.round(performance.now()-roundStart),ok=v===a;combo=ok?combo+1:0;let boost=ok?Math.max(5,13-Math.floor(ms/450)+Math.min(combo,5)):1;progress=Math.min(100,progress+boost);send('answer',{ok,time:ms,progress:boost,round,game:room.game_type});renderRace();setTimeout(()=>{if(progress>=100)finish(true);else nextRound()},500)}
function numberRound(){let r=seed(),len=Math.min(5+Math.floor(round/3),11),n='';for(let i=0;i<len;i++)n+=Math.floor(r()*10);shell(`<p class="center">Memorize this ${len}-digit number.</p><div class="q">${n}</div>`);setTimeout(()=>{if(!started)return;shell(`<p class="center">Enter the number.</p><input id="typed" class="input" inputmode="numeric"><div class="center" style="margin-top:15px"><button class="btn primary" onclick="numberSubmit('${n}')">Submit</button></div>`);},Math.max(800,2100-round*100))}function numberSubmit(n){if(answered)return;answered=true;let ms=Math.round(performance.now()-roundStart),ok=document.getElementById('typed').value===n;combo=ok?combo+1:0;let boost=ok?Math.max(5,12-Math.floor(ms/500)):1;progress=Math.min(100,progress+boost);send('answer',{ok,time:ms,progress:boost,round});setTimeout(()=>nextRound(),450)}
function reactionRound(){shell('<p class="center">Wait… click when the signal appears.</p>');let delay=700+Math.random()*1800;setTimeout(()=>{if(!started)return;document.getElementById('game').insertAdjacentHTML('beforeend','<div class="center"><button class="btn primary" id="go" style="font-size:28px">⚡ GO!</button></div>');let t=performance.now();document.getElementById('go').onclick=()=>{if(answered)return;answered=true;let ms=Math.round(performance.now()-t),boost=Math.max(5,15-Math.floor(ms/80));progress=Math.min(100,progress+boost);send('reaction',{time:ms,progress:boost,round});renderRace();setTimeout(()=>nextRound(),450)}},delay)}
function logicRound(){let r=seed(),type=Math.floor(r()*3),q,ans,options;if(type===0){let statements=[['All Nors are Veks. All Veks are Tals. Therefore all Nors are Tals.','TRUE'],['All Lums are Reks. Some Reks are Pals. Therefore some Lums are Pals.','FALSE']];let s=statements[Math.floor(r()*statements.length)];q=s[0];ans=s[1];options=opts(ans,ans==='TRUE'?'FALSE':'TRUE','CANNOT TELL','BOTH')}else if(type===1){q='Which item does NOT belong? 2, 4, 8, 16, 31';ans='31';options=opts(ans,'16','8','4')}else{q='A is taller than B. B is taller than C. Which is shortest?';ans='C';options=opts(ans,'A','B','Cannot tell')}shell(`<p class="center">Deduction challenge</p><div class="q" style="font-size:27px;line-height:1.3">${q}</div><div class="choices">${options.map(x=>`<button class="btn choice" onclick="submitAnswer(${JSON.stringify(x)},${JSON.stringify(ans)})">${x}</button>`).join('')}</div>`)}
function sequenceRound(){let r=seed(),type=Math.floor(r()*3),q,ans,options;if(type===0){let a=2+Math.floor(r()*8),step=2+Math.floor(r()*6);ans=a+step*4;q=`${a} → ${a+step} → ${a+step*2} → ${a+step*3} → ?`;options=opts(ans,ans+2,ans-step,ans+step)}else if(type===1){let a=2+Math.floor(r()*5);ans=a*16;q=`${a} → ${a*2} → ${a*4} → ${a*8} → ?`;options=opts(ans,ans+4,ans*2,ans-2)}else{let a=3+Math.floor(r()*6);ans=a+10;q=`${a}, ${a+1}, ${a+3}, ${a+6}, ?`;options=opts(ans,ans+1,ans+2,ans+4)}shell(`<p class="center">Pattern prediction</p><div class="q">${q}</div><div class="choices">${options.map(x=>`<button class="btn choice" onclick="submitAnswer(${x},${ans})">${x}</button>`).join('')}</div>`)}
function focusRound(){let r=seed(),n=8+Math.floor(r()*8),target=Math.floor(r()*n);shell(`<p class="center">Find the different symbol.</p><div class="choices">${Array.from({length:n},(_,i)=>`<button class="btn choice" style="font-size:26px" onclick="submitAnswer(${i},${target})">${i===target?'○':'●'}</button>`).join('')}</div>`)}function targetRound(){let r=seed(),colors=['RED','BLUE','GREEN','PURPLE'],target=colors[Math.floor(r()*4)];shell(`<div class="q">Select the <b>${target}</b> tile</div><div class="choices">${colors.sort(()=>r()-.5).map(x=>`<button class="btn choice" onclick="submitAnswer(${JSON.stringify(x)},${JSON.stringify(target)})">${x}</button>`).join('')}</div>`)}function spatialRound(){let r=seed(),dirs=['↑','→','↓','←'],i=Math.floor(r()*4),rot=round%2?1:2,ans=dirs[(i+rot)%4];shell(`<div class="q">${dirs[i]} + ${rot===1?'90°':'180°'} = ?</div><div class="choices">${dirs.map(x=>`<button class="btn choice" onclick="submitAnswer(${JSON.stringify(x)},${JSON.stringify(ans)})">${x}</button>`).join('')}</div>`)}function memoryRound(){let r=seed(),count=Math.min(3+Math.floor(round/2),8),size=16,arr=[];while(arr.length<count){let x=Math.floor(r()*size);if(!arr.includes(x))arr.push(x)}shell(`<p class="center">Memorize ${count} highlighted tiles.</p><div id="memgrid" style="display:grid;grid-template-columns:repeat(4,55px);gap:7px;justify-content:center">${Array.from({length:size},(_,i)=>`<button id="m${i}" class="btn" style="height:55px">${arr.includes(i)?'◆':''}</button>`).join('')}</div>`);setTimeout(()=>{if(!started)return;document.querySelectorAll('#memgrid button').forEach((b,i)=>{b.textContent='';b.onclick=()=>b.classList.toggle('primary')});let c=document.createElement('button');c.className='btn primary';c.textContent='Check';c.onclick=()=>{let picked=[...document.querySelectorAll('#memgrid button')].map((b,i)=>b.classList.contains('primary')?i:-1).filter(i=>i>=0);let ok=picked.length===arr.length&&picked.every(i=>arr.includes(i));answered=true;let boost=ok?12:2;progress=Math.min(100,progress+boost);send('answer',{ok,time:Math.round(performance.now()-roundStart),progress:boost,round});setTimeout(nextRound,450)};document.getElementById('game').appendChild(c)},Math.max(900,2200-round*100))}
function renderRace(){let r=document.querySelector('.runner'),o=document.querySelector('.runner.b');if(r)r.style.left=progress+'%';if(o)o.style.left=opp+'%';let s=document.getElementById('raceStatus');if(s)s.textContent=`YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}% • 🔥 ${combo} COMBO`}
async function finish(local){if(!started)return;started=false;if(local)await send('finish',{progress,round});if(local)await sb.from('mm_rooms').update({status:'FINISHED'}).eq('id',room.id);document.getElementById('game').innerHTML=`<div class="center"><h1>🏆 MATCH COMPLETE</h1><p>YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}%</p><h2>${progress>=opp?'🔥 YOU WIN':'⚡ GOOD RUN'}</h2><button class="btn primary" onclick="location.reload()">REMATCH</button></div>`}
ready();</script></body></html>
