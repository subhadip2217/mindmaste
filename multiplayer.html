<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Master — Math Rush Online</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#03050b;color:#f8fafc;font:16px system-ui;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:24px}.glass{background:#ffffff08;border:1px solid #ffffff18;border-radius:22px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 20px 70px #0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn,input{padding:12px 15px;border-radius:12px;border:1px solid #ffffff20;background:#ffffff0a;color:#fff}.btn{cursor:pointer;font-weight:700}.primary{background:linear-gradient(100deg,#8b5cf6,#06b6d4);border:0}.q{font-size:48px;text-align:center;margin:25px}.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choice{min-width:110px}.race{height:180px;position:relative;background:#ffffff05;border-radius:18px;margin:15px 0}.track{position:absolute;left:35px;right:35px;top:85px;height:7px;background:#ffffff15}.runner{position:absolute;left:0;top:50px;font-size:28px;transition:left .3s}.runner.b{top:105px}.status{color:#9ca3af}.good{color:#34d399}.bad{color:#fb7185}@media(max-width:700px){.grid{grid-template-columns:1fr}.q{font-size:34px}}</style></head><body><main class="wrap"><div class="glass"><h1>🧠 MIND MASTER — 🏁 MATH RUSH</h1><p class="status">Real-time 1v1 • Same questions • Server-synchronized room events</p><div class="grid"><section><h3>Create room</h3><input id="name1" placeholder="Your name"><button class="btn primary" onclick="createRoom()">Create</button><h3>Join room</h3><input id="code" placeholder="A7K9Q"><input id="name2" placeholder="Your name"><button class="btn" onclick="joinRoom()">Join</button></section><section><h3>Connection</h3><div id="status">Not connected</div><div id="roomInfo"></div></section></div></div><div id="game" class="glass" style="margin-top:15px;display:none"></div></main><script>
const CONFIG={SUPABASE_URL:'YOUR_SUPABASE_PROJECT_URL',SUPABASE_ANON_KEY:'YOUR_SUPABASE_ANON_KEY'};let sb,room=null,me='',sub=null,round=0,progress=0,opp=0,combo=0,matchSeed=0,started=false;
function ready(){if(CONFIG.SUPABASE_URL.startsWith('YOUR_')){document.getElementById('status').innerHTML='<span class="bad">Add your Supabase URL and anon public key in this file after creating the project.</span>';return false}sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);return true}
function code(){return Math.random().toString(36).slice(2,7).toUpperCase()}
async function createRoom(){if(!ready())return;me=document.getElementById('name1').value.trim()||'Player 1';let c=code();let pid=crypto.randomUUID();let {data,error}=await sb.from('mm_rooms').insert({room_code:c,player1_id:pid,player1_name:me}).select().single();if(error)return show(error.message);room=data;localStorage.mmPlayer=pid;await subscribe();showRoom();}
async function joinRoom(){if(!ready())return;me=document.getElementById('name2').value.trim()||'Player 2';let c=document.getElementById('code').value.trim().toUpperCase();let pid=crypto.randomUUID();let {data,error}=await sb.from('mm_rooms').select('*').eq('room_code',c).gt('expires_at',new Date().toISOString()).single();if(error||!data)return show('Room not found or expired.');if(data.player2_id)return show('Room is full.');let up=await sb.from('mm_rooms').update({player2_id:pid,player2_name:me,status:'READY'}).eq('id',data.id).is('player2_id',null);if(up.error)return show(up.error.message);room={...data,player2_id:pid,player2_name:me,status:'READY'};localStorage.mmPlayer=pid;await subscribe();showRoom();}
async function subscribe(){if(sub)await sb.removeChannel(sub);sub=sb.channel('mm-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'mm_rooms',filter:'id=eq.'+room.id},payload=>{room=payload.new;showRoom();if(room.status==='PLAYING'&&!started)startMatch(false)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'mm_events',filter:'room_id=eq.'+room.id},payload=>handleEvent(payload.new)).subscribe();document.getElementById('status').innerHTML='<span class="good">🟢 Realtime connected</span>';}
function showRoom(){document.getElementById('roomInfo').innerHTML=`<h2>Room ${room.room_code}</h2><p>YOU: ${me}</p><p>OPPONENT: ${room.player1_id&&room.player2_id?(room.player1_id===localStorage.mmPlayer?room.player2_name:room.player1_name):'Waiting…'}</p><button class="btn primary" onclick="readyUp()">READY</button>`}
async function readyUp(){if(!room)return;await send('ready',{name:me});let {data}=await sb.from('mm_events').select('player_id').eq('room_id',room.id).eq('event_type','ready');if(data&&new Set(data.map(x=>x.player_id)).size>=2){await sb.from('mm_rooms').update({status:'COUNTDOWN'}).eq('id',room.id);await send('countdown',{at:Date.now()+3500});}}
async function send(type,payload){let pid=localStorage.mmPlayer;return sb.from('mm_events').insert({room_id:room.id,player_id:pid,event_type:type,payload})}
function handleEvent(e){if(e.player_id===localStorage.mmPlayer)return;if(e.event_type==='answer'){opp=Math.min(100,opp+e.payload.progress);renderRace();}if(e.event_type==='countdown'){setTimeout(()=>startMatch(false),3000)}}
function startMatch(local=true){if(started)return;started=true;round=0;progress=0;opp=0;combo=0;document.getElementById('game').style.display='block';if(local)sb.from('mm_rooms').update({status:'PLAYING'}).eq('id',room.id);setTimeout(nextRound,local?3200:500)}
function nextRound(){if(round>=10){finish();return}round++;let a=3+Math.floor(Math.random()*14),b=2+Math.floor(Math.random()*12),ans=a*b;let opts=[ans,ans+b,ans-2,ans+3].sort(()=>Math.random()-.5);let startedAt=performance.now();document.getElementById('game').innerHTML=`<h2>Round ${round}/10</h2><div class="race"><div class="track"></div><div class="runner" style="left:${progress}%">🏃</div><div class="runner b" style="left:${opp}%">🏃</div></div><div class="q">${a} × ${b} = ?</div><div class="choices">${opts.map(x=>`<button class="btn choice" onclick="answer(${x},${ans},${startedAt})">${x}</button>`).join('')}</div><p id="raceStatus">YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}% • Combo ${combo}</p>`}
async function answer(v,ans,t){let ok=v===ans,ms=Math.round(performance.now()-t);combo=ok?combo+1:0;let boost=ok?Math.max(5,11-Math.floor(ms/500)):1;progress=Math.min(100,progress+boost);await send('answer',{ok,time:ms,progress:boost,round});renderRace();setTimeout(()=>{if(progress>=100)finish();else nextRound()},350)}
function renderRace(){let r=document.querySelector('.runner'),o=document.querySelector('.runner.b');if(r)r.style.left=progress+'%';if(o)o.style.left=opp+'%';let s=document.getElementById('raceStatus');if(s)s.textContent=`YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}% • Combo ${combo}`}
async function finish(){if(!started)return;started=false;let winner=progress>=100&&progress>=opp;await send('finish',{progress});await sb.from('mm_rooms').update({status:'FINISHED'}).eq('id',room.id);document.getElementById('game').innerHTML=`<h1>${winner?'🏆 YOU WIN':'🏁 MATCH COMPLETE'}</h1><p>Final progress: YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}%</p><button class="btn primary" onclick="location.reload()">REMATCH</button>`}
function show(x){document.getElementById('status').textContent=x}
</script></body></html>
