<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Master Multiplayer</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:radial-gradient(circle at 15% 10%,#8b5cf633,transparent 30%),radial-gradient(circle at 85% 20%,#06b6d422,transparent 30%),#03050b;color:#f8fafc;font:15px system-ui}.wrap{max-width:1150px;margin:auto;padding:20px}.glass{background:#ffffff09;border:1px solid #ffffff18;border-radius:22px;padding:20px;backdrop-filter:blur(15px);box-shadow:0 20px 60px #0008}.hero{text-align:center}.hero h1{font-size:clamp(40px,8vw,72px);margin:5px;background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);color:transparent;background-clip:text}.muted{color:#9ca3af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.game{cursor:pointer;min-height:135px;transition:.2s}.game:hover,.selected{transform:translateY(-3px);border-color:#22d3ee77}.icon{font-size:30px}.tag{font-size:10px;padding:4px 8px;border-radius:20px;background:#8b5cf622;color:#c4b5fd}.actions,.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.btn,input{padding:12px 15px;border-radius:12px;border:1px solid #ffffff20;background:#ffffff0b;color:#fff}.btn{cursor:pointer;font-weight:700}.primary{background:linear-gradient(100deg,#8b5cf6,#06b6d4);border:0}.gameplay{margin-top:16px}.q{text-align:center;font-size:40px;margin:24px}.choice{min-width:110px}.race{height:175px;position:relative;background:#ffffff05;border-radius:18px;overflow:hidden}.track{position:absolute;left:30px;right:30px;top:83px;height:7px;background:#ffffff15}.runner{position:absolute;top:48px;font-size:28px;transition:left .3s}.runner.b{top:105px}.finish{position:absolute;right:18px;top:50px;font-size:42px}.center{text-align:center}.good{color:#34d399}.bad{color:#fb7185}.hidden{display:none}@media(max-width:650px){.wrap{padding:10px}.q{font-size:30px}.actions>*{width:100%}}</style></head><body><main class="wrap"><header class="glass hero"><div>🌌 AURA BRAIN ARENA</div><h1>MIND MASTER</h1><p class="muted">Train your mind. Challenge your friend. Improve every day.</p></header><section class="glass" style="margin-top:15px"><h2>🎮 Choose a multiplayer game</h2><p class="muted">Every match generates fresh challenges. Both players receive the same round seed.</p><div id="games" class="grid"></div></section><section class="glass" style="margin-top:15px"><h2>⚔️ Online Room</h2><div class="actions"><input id="name" placeholder="Your name"><button class="btn primary" onclick="createRoom()">CREATE ROOM</button><input id="code" placeholder="ROOM CODE"><button class="btn" onclick="joinRoom()">JOIN ROOM</button></div><p id="status" class="muted">Choose a game and create a room.</p><div id="roomInfo"></div></section><section id="game" class="glass gameplay hidden"></section></main><script>
const URL='https://cpursknrmguwxglnzgke.supabase.co',KEY='sb_publishable_CIA6kWSUS7A7-YINdeocVw_SI7I9utS';const sb=window.supabase.createClient(URL,KEY,{auth:{persistSession:false}});const G=[['math','🏁','Math Rush','Calculation','Fast arithmetic race'],['memory','🧠','Memory Battle','Memory','Remember visual patterns'],['numbers','🔢','Number Recall Duel','Memory','Recall changing number strings'],['reaction','⚡','Reaction Duel','Reaction','React and stay consistent'],['logic','🧩','Logic Duel','Deduction','Reasoning, ordering and deduction'],['focus','🔍','Focus Hunt Duel','Attention','Find targets among distractors'],['sequence','🔄','Sequence Duel','Pattern','Discover changing numerical patterns'],['target','🎯','Target Shift Duel','Flexibility','Follow changing rules'],['spatial','🧱','Spatial Duel','Spatial','Mental rotation and direction']];let selected='math',room=null,pid='',channel=null,round=0,my=0,opp=0,combo=0,answered=false,start=0,playing=false;
document.getElementById('games').innerHTML=G.map(g=>`<article class="glass game ${g[0]==='math'?'selected':''}" onclick="pick('${g[0]}')"><div class="icon">${g[1]}</div><span class="tag">${g[3]}</span><h3>${g[2]}</h3><p class="muted">${g[4]}</p></article>`).join('');const gm=Object.fromEntries(G.map(x=>[x[0],x]));function pick(x){if(room)return;selected=x;document.querySelectorAll('.game').forEach((e,i)=>e.classList.toggle('selected',G[i][0]===x));status('Selected '+gm[x][2])}function status(x){document.getElementById('status').textContent=x}function code(){return Math.random().toString(36).slice(2,7).toUpperCase()}function id(){return crypto.randomUUID()}
async function createRoom(){pid=id();let name=document.getElementById('name').value.trim()||'Player 1',c=code();let r=await sb.from('mm_rooms').insert({room_code:c,game_type:selected,player1_id:pid,player1_name:name,status:'WAITING'}).select().single();if(r.error)return status('❌ '+r.error.message);room=r.data;localStorage.mmPid=pid;await listen();showRoom()}async function joinRoom(){pid=id();let name=document.getElementById('name').value.trim()||'Player 2',c=document.getElementById('code').value.trim().toUpperCase();let r=await sb.from('mm_rooms').select('*').eq('room_code',c).gt('expires_at',new Date().toISOString()).single();if(r.error||!r.data)return status('❌ Room not found or expired.');if(r.data.player2_id||r.data.status!=='WAITING')return status('❌ Room is full or already started.');let u=await sb.from('mm_rooms').update({player2_id:pid,player2_name:name}).eq('id',r.data.id).is('player2_id',null);if(u.error)return status('❌ '+u.error.message);room={...r.data,player2_id:pid,player2_name:name};selected=room.game_type;document.querySelectorAll('.game').forEach((e,i)=>e.classList.toggle('selected',G[i][0]===selected));await listen();showRoom()}
async function listen(){channel=sb.channel('mindmaster-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'mm_rooms',filter:'id=eq.'+room.id},e=>{if(e.new){room=e.new;showRoom();if(room.status==='COUNTDOWN')countdown();}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'mm_events',filter:'room_id=eq.'+room.id},e=>event(e.new)).subscribe(s=>{if(s==='SUBSCRIBED')status('🟢 Realtime connected')})}function showRoom(){let me=room.player1_id===pid?room.player1_name:room.player2_name,op=room.player1_id===pid?room.player2_name:room.player1_name;document.getElementById('roomInfo').innerHTML=`<div class="glass"><h2>Room <b>${room.room_code}</b></h2><p>🎮 ${gm[room.game_type][2]}</p><p>👤 You: ${me||'You'}</p><p>👥 Friend: ${op||'Waiting…'}</p><p>Status: <b>${room.status}</b></p>${room.player2_id&&room.status==='WAITING'?'<button class="btn primary" onclick="ready()">READY</button>':''}</div>`}async function send(type,payload){return sb.from('mm_events').insert({room_id:room.id,player_id:pid,event_type:type,payload})}async function ready(){await send('ready',{});let r=await sb.from('mm_events').select('player_id').eq('room_id',room.id).eq('event_type','ready');if(r.data&&new Set(r.data.map(x=>x.player_id)).size>=2){await sb.from('mm_rooms').update({status:'COUNTDOWN'}).eq('id',room.id)}}function event(e){if(e.player_id===pid)return;if(e.event_type==='answer'){opp=Math.min(100,opp+(e.payload.boost||1));draw()}if(e.event_type==='finish'){playing=false;result(false)}}function countdown(){if(playing)return;let n=3;document.getElementById('game').classList.remove('hidden');document.getElementById('game').innerHTML=`<div class="center"><h1 id="cnt">3</h1><p>GET READY</p></div>`;let t=setInterval(()=>{n--;if(n===0){clearInterval(t);sb.from('mm_rooms').update({status:'PLAYING'}).eq('id',room.id);startMatch()}else document.getElementById('cnt').textContent=n},1000)}function startMatch(){if(playing)return;playing=true;round=0;my=0;opp=0;combo=0;next()}
function rng(){let s=0;for(let i=0;i<room.id.length;i++)s=(s*31+room.id.charCodeAt(i))>>>0;s=(s+round*99991)>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}function shuffle(a){return a.sort(()=>Math.random()-.5)}function shell(html){document.getElementById('game').innerHTML=`<h2>${gm[room.game_type][1]} ${gm[room.game_type][2]} <span class="tag">Round ${round}/10</span></h2><div class="race"><div class="track"></div><div class="runner" style="left:${my}%">🏃</div><div class="runner b" style="left:${opp}%">🏃</div><div class="finish">🏁</div></div>${html}<p id="st" class="center">YOU ${Math.round(my)}% • OPPONENT ${Math.round(opp)}% • 🔥 ${combo}</p>`;start=performance.now()}function buttons(a,ans){return shuffle([ans,...a]).map(x=>`<button class="btn choice" onclick="answer(${JSON.stringify(x)},${JSON.stringify(ans)})">${x}</button>`).join('')}
function next(){if(!playing)return;if(round++>=10){result(true);return}answered=false;let r=rng(),d=Math.min(20,1+Math.floor(round/3));switch(room.game_type){case'math':{let a=3+~~(r()*(8+d)),b=2+~~(r()*(7+d)),op=d>7&&r()>.55?'+':'×',ans=op==='×'?a*b:a+b;shell(`<div class="q">${a} ${op} ${b} = ?</div><div class="choices">${buttons([ans+b,ans-2,ans+3],ans)}</div>${round>7?'<p class="center">🔥 RISK ROUND</p>':''}`);break}case'logic':logic(r,d);break;case'sequence':sequence(r,d);break;case'numbers':numbers(r,d);break;case'focus':focus(r,d);break;case'target':target(r,d);break;case'spatial':spatial(r,d);break;case'reaction':reaction();break;case'memory':memory(r,d)}}
function logic(r,d){let type=~~(r()*4),q,ans,wr;if(type===0){let a=3+~~(r()*7),b=2+~~(r()*5);q=`A is older than B. B is older than C. C is older than D. Who is youngest?`;ans='D';wr=['A','B','C']}else if(type===1){q=`All Veks are Nors. No Nors are Tals. Can a Vek be a Tal?`;ans='NO';wr=['YES','ALWAYS','CANNOT TELL']}else if(type===2){let x=2+~~(r()*8);q=`Which statement must be true? If ${x} > 5 and 5 > 2`;ans=`${x} > 2`;wr=[`${x} < 2`,'2 > 5','5 < 2']}else{q='Which does not belong: triangle, square, circle, cube?';ans='cube';wr=['triangle','square','circle']}shell(`<div class="q" style="font-size:27px;line-height:1.35">${q}</div><div class="choices">${buttons(wr,ans)}</div>`)}function sequence(r,d){let type=~~(r()*5),a=2+~~(r()*(5+d)),step=2+~~(r()*(3+d/3)),arr,ans;if(type===0){arr=[a,a+step,a+2*step,a+3*step];ans=a+4*step}else if(type===1){arr=[a,a*2,a*4,a*8];ans=a*16}else if(type===2){arr=[a,a+1,a+4,a+9];ans=a+16}else if(type===3){arr=[a,a+2,a+6,a+12];ans=a+20}else{arr=[a,a*3,a*3+2,a*9+2];ans=a*27+6}shell(`<div class="q">${arr.join(' → ')} → ?</div><div class="choices">${buttons([ans+1,ans-2,ans+step],ans)}</div>`)}function numbers(r,d){let len=Math.min(5+~~(d/2),12),n='';for(let i=0;i<len;i++)n+=~~(r()*10);shell(`<p class="center">Memorize this number.</p><div class="q">${n}</div>`);setTimeout(()=>{if(!playing)return;let s=performance.now();document.getElementById('game').innerHTML=`<h2>🔢 Number Recall Duel</h2><p class="center">Enter the ${len}-digit number.</p><div class="choices"><input id="typed" inputmode="numeric"><button class="btn primary" onclick="numAnswer('${n}',${s})">Submit</button></div>`;start=s},Math.max(900,1900-d*50))}function numAnswer(n,s){if(answered)return;answered=true;let ok=document.getElementById('typed').value===n,ms=performance.now()-s;advance(ok,ms)}function focus(r,d){let n=Math.min(8+~~(d/2),20),special=~~(r()*n),arr=Array(n).fill('●');arr[special]='○';shell(`<p class="center">Find the different symbol.</p><div class="choices">${arr.map((x,i)=>`<button class="btn choice" onclick="focusAnswer(${i},${special})">${x}</button>`).join('')}</div>`)}function focusAnswer(i,s){if(answered)return;answered=true;advance(i===s,performance.now()-start)}function target(r,d){let colors=['RED','BLUE','GREEN','PURPLE'],target=colors[~~(r()*4)],rules=['Select the '+target,'Select the largest shape','Select the '+target+' circle','Select the shape with 3 sides'];let rule=rules[round%rules.length];let ans=rule.includes('largest')?'LARGE':rule.includes('3 sides')?'TRIANGLE':target;let wr=rule.includes('largest')?['SMALL','MEDIUM','TINY']:rule.includes('3 sides')?['CIRCLE','SQUARE','STAR']:colors.filter(x=>x!==target).slice(0,3);shell(`<p class="center"><b>RULE:</b> ${rule}</p><div class="choices">${buttons(wr,ans)}</div>`)}function spatial(r,d){let dirs=['↑','→','↓','←'],x=~~(r()*4),turn=(d%2?1:2),ans=dirs[(x+turn)%4];shell(`<div class="q">${dirs[x]} rotated ${turn===1?'90°':'180°'} = ?</div><div class="choices">${buttons(dirs.filter(x=>x!==ans),ans)}</div>`)}function reaction(){shell('<p class="center">Wait for ⚡ GO!</p>');let delay=700+Math.random()*1800;setTimeout(()=>{if(!playing)return;let b=document.createElement('button');b.className='btn primary';b.textContent='⚡ GO!';b.style.fontSize='28px';document.getElementById('game').appendChild(b);let t=performance.now();b.onclick=()=>{if(answered)return;answered=true;advance(true,performance.now()-t)}},delay)}function memory(r,d){let n=Math.min(3+~~(d/3),9),tiles=[];while(tiles.length<n){let x=~~(r()*16);if(!tiles.includes(x))tiles.push(x)}shell(`<p class="center">Memorize the glowing tiles.</p><div class="choices" id="tiles" style="max-width:500px;margin:auto">${Array.from({length:16},(_,i)=>`<button class="btn" data-i="${i}" style="width:60px;height:60px"></button>`).join('')}</div>`);tiles.forEach(i=>document.querySelector(`[data-i="${i}"]`).style.background='linear-gradient(135deg,#8b5cf6,#22d3ee)');setTimeout(()=>{if(!playing)return;let picked=[];document.querySelectorAll('#tiles button').forEach(b=>{b.style.background='';b.onclick=()=>{b.classList.toggle('primary');let i=+b.dataset.i;if(picked.includes(i))picked=picked.filter(x=>x!==i);else picked.push(i)}});let c=document.createElement('button');c.className='btn primary';c.textContent='CHECK';c.onclick=()=>{if(answered)return;answered=true;advance(picked.length===tiles.length&&picked.every(x=>tiles.includes(x)),performance.now()-start)};document.getElementById('game').appendChild(c)},Math.max(900,2200-d*60))}function advance(ok,ms){combo=ok?combo+1:0;let boost=ok?Math.max(4,12-Math.floor(ms/600)+Math.min(combo,5)):1;my=Math.min(100,my+boost);send('answer',{ok,time:Math.round(ms),boost,round,game:room.game_type});draw();setTimeout(()=>{if(my>=100)finish();else next()},450)}function draw(){let e=document.getElementById('st');if(e)e.textContent=`YOU ${Math.round(my)}% • OPPONENT ${Math.round(opp)}% • 🔥 ${combo}`}async function finish(){if(!playing)return;playing=false;await send('finish',{progress:my});result(true)}function result(win){document.getElementById('game').classList.remove('hidden');document.getElementById('game').innerHTML=`<div class="center"><h1>${win?'🏆 YOU WIN':'🏁 OPPONENT WINS'}</h1><p>Final progress: ${Math.round(my)}% — ${Math.round(opp)}%</p><p class="muted">Play again with a fresh challenge set.</p><button class="btn primary" onclick="location.reload()">REMATCH ⚔️</button></div>`}
</script></body></html>
