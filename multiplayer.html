<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Master — Multiplayer Brain Arena</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#03050b;color:#f8fafc;font:16px system-ui;min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:24px}.glass{background:#ffffff08;border:1px solid #ffffff18;border-radius:22px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 20px 70px #0008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}.game{padding:13px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff08;color:#fff;text-align:left;cursor:pointer}.game.selected{border-color:#06b6d4;background:#06b6d422;box-shadow:0 0 0 1px #06b6d466}.game b{display:block;margin-bottom:4px}.game small{color:#9ca3af}.btn,input{padding:12px 15px;border-radius:12px;border:1px solid #ffffff20;background:#ffffff0a;color:#fff}.btn{cursor:pointer;font-weight:700}.primary{background:linear-gradient(100deg,#8b5cf6,#06b6d4);border:0}.q{font-size:42px;text-align:center;margin:22px}.choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.choice{min-width:110px}.race{height:180px;position:relative;background:#ffffff05;border-radius:18px;margin:15px 0}.track{position:absolute;left:35px;right:35px;top:85px;height:7px;background:#ffffff15}.runner{position:absolute;left:0;top:50px;font-size:28px;transition:left .3s}.runner.b{top:105px}.status{color:#9ca3af}.good{color:#34d399}.bad{color:#fb7185}.tag{display:inline-block;padding:5px 9px;border-radius:99px;background:#ffffff10;color:#c4b5fd;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,1fr)}.q{font-size:32px}}@media(max-width:480px){.games{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="glass"><h1>🧠 MIND MASTER — 🏁 MULTIPLAYER</h1><p class="status">Real-time 1v1 • Choose one of 9 brain games before creating the room</p><div class="grid"><section><h3>Create room</h3><input id="name1" placeholder="Your name"><h4>Select a game</h4><div class="games" id="games"></div><button class="btn primary" onclick="createRoom()">Create Room</button><h3>Join room</h3><input id="code" placeholder="A7K9Q"><input id="name2" placeholder="Your name"><button class="btn" onclick="joinRoom()">Join Room</button></section><section><h3>Connection</h3><div id="status">Connecting…</div><div id="roomInfo"></div></section></div></div><div id="game" class="glass" style="margin-top:15px;display:none"></div></main><script>
const CONFIG={SUPABASE_URL:'https://cpursknrmguwxglnzgke.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_CIA6kWSUS7A7-YINdeocVw_SI7I9utS'};
const GAMES=[['math-rush','🧮','Math Rush','Fast multiplication'],['memory-match','🧠','Memory Match','Remember the sequence'],['number-sequence','🔢','Number Sequence','Find the next number'],['quick-calc','⚡','Quick Calculation','Mixed mental math'],['odd-one-out','🎯','Odd One Out','Spot the different item'],['pattern-master','🧩','Pattern Master','Complete the pattern'],['reaction-rush','🏃','Reaction Rush','Choose the target fast'],['word-scramble','🔤','Word Scramble','Unscramble the word'],['logic-duel','💡','Logic Duel','Solve the logic question']];
let sb,room=null,me='',sub=null,round=0,progress=0,opp=0,combo=0,started=false,selectedGame='math-rush';
function ready(){if(!window.supabase){show('Supabase library failed to load.');return false}if(!sb)sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{persistSession:false}});document.getElementById('status').innerHTML='<span class="good">🟢 Supabase connected</span>';return true}
function renderGames(){document.getElementById('games').innerHTML=GAMES.map(g=>`<button class="game ${g[0]===selectedGame?'selected':''}" onclick="selectGame('${g[0]}')"><b>${g[1]} ${g[2]}</b><small>${g[3]}</small></button>`).join('')}
function selectGame(g){selectedGame=g;renderGames()}
function code(){return Math.random().toString(36).slice(2,7).toUpperCase()}
function gameName(id){let g=GAMES.find(x=>x[0]===id);return g?g[1]+' '+g[2]:id}
async function createRoom(){if(!ready())return;me=document.getElementById('name1').value.trim()||'Player 1';let c=code(),pid=crypto.randomUUID();let {data,error}=await sb.from('mm_rooms').insert({room_code:c,game_type:selectedGame,player1_id:pid,player1_name:me}).select().single();if(error)return show(error.message);room=data;localStorage.mmPlayer=pid;await subscribe();showRoom()}
async function joinRoom(){if(!ready())return;me=document.getElementById('name2').value.trim()||'Player 2';let c=document.getElementById('code').value.trim().toUpperCase(),pid=crypto.randomUUID();let {data,error}=await sb.from('mm_rooms').select('*').eq('room_code',c).gt('expires_at',new Date().toISOString()).single();if(error||!data)return show('Room not found or expired.');if(data.player2_id)return show('Room is full.');let up=await sb.from('mm_rooms').update({player2_id:pid,player2_name:me,status:'READY'}).eq('id',data.id).is('player2_id',null);if(up.error)return show(up.error.message);room={...data,player2_id:pid,player2_name:me,status:'READY'};localStorage.mmPlayer=pid;await subscribe();showRoom()}
async function subscribe(){if(sub)await sb.removeChannel(sub);sub=sb.channel('mm-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'mm_rooms',filter:'id=eq.'+room.id},p=>{room=p.new;showRoom();if(room.status==='PLAYING'&&!started)startMatch(false)}).on('postgres_changes',{event:'INSERT',schema:'public',table:'mm_events',filter:'room_id=eq.'+room.id},p=>handleEvent(p.new)).subscribe(s=>{if(s==='SUBSCRIBED')document.getElementById('status').innerHTML='<span class="good">🟢 Realtime connected</span>'})}
function showRoom(){if(!room)return;document.getElementById('roomInfo').innerHTML=`<h2>Room ${room.room_code}</h2><p>YOU: ${me}</p><p>GAME: <span class="tag">${gameName(room.game_type||'math-rush')}</span></p><p>OPPONENT: ${room.player1_id&&room.player2_id?(room.player1_id===localStorage.mmPlayer?room.player2_name:room.player1_name):'Waiting…'}</p><button class="btn primary" onclick="readyUp()">READY</button>`}
async function readyUp(){if(!room)return;await send('ready',{name:me});let {data}=await sb.from('mm_events').select('player_id').eq('room_id',room.id).eq('event_type','ready');if(data&&new Set(data.map(x=>x.player_id)).size>=2){await sb.from('mm_rooms').update({status:'COUNTDOWN'}).eq('id',room.id);await send('countdown',{at:Date.now()+3500})}}
async function send(type,payload){return sb.from('mm_events').insert({room_id:room.id,player_id:localStorage.mmPlayer,event_type:type,payload})}
function handleEvent(e){if(e.player_id===localStorage.mmPlayer)return;if(e.event_type==='answer'){opp=Math.min(100,opp+Number(e.payload.progress||0));renderRace()}if(e.event_type==='countdown')setTimeout(()=>startMatch(false),3000)}
function rng(seed){let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))>>>0;return()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296}}
function shuffle(a,r){return a.map(x=>[r(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1])}
const WORDS=['PLANET','PYTHON','MATRIX','PUZZLE','GALAXY','CODING','MEMORY','ROCKET','NUMBER','LOGIC'];
function roundData(){let id=room.game_type||'math-rush',r=rng(room.id+id+round),a,b,ans,opts,q,display;
if(id==='math-rush'){a=3+Math.floor(r()*14);b=2+Math.floor(r()*12);ans=a*b;q=`${a} × ${b} = ?`;opts=[ans,ans+b,ans-2,ans+3]}
else if(id==='memory-match'){let seq=Array.from({length:4},()=>1+Math.floor(r()*9));ans=seq[3];q=`Remember: ${seq.join('  ')}<br><small>What was the last number?</small>`;opts=[ans,1+Math.floor(r()*9),1+Math.floor(r()*9),1+Math.floor(r()*9)]}
else if(id==='number-sequence'){let start=2+Math.floor(r()*8),step=2+Math.floor(r()*6);let seq=[start,start+step,start+2*step,start+3*step];ans=start+4*step;q=`${seq.join(', ')}, ?`;opts=[ans,ans+step,ans-2,ans+2]}
else if(id==='quick-calc'){a=10+Math.floor(r()*40);b=2+Math.floor(r()*15);let type=Math.floor(r()*3);if(type===0){ans=a+b;q=`${a} + ${b} = ?`}else if(type===1){ans=a-b;q=`${a} − ${b} = ?`}else{ans=a*b;q=`${a} × ${b} = ?`}opts=[ans,ans+3,ans-4,ans+7]}
else if(id==='odd-one-out'){let base=2+Math.floor(r()*7),different=base+1;let arr=[base,base,base,different];opts=shuffle(arr,r);ans=different;q=`Which number is different?`}
else if(id==='pattern-master'){let start=1+Math.floor(r()*6),step=2+Math.floor(r()*5);ans=start+4*step;q=`Pattern: ${start}, ${start+step}, ${start+2*step}, ${start+3*step}, ?`;opts=[ans,ans+step,ans-1,ans+2]}
else if(id==='reaction-rush'){let icons=['▲','●','■','◆'],target=icons[Math.floor(r()*icons.length)];ans=target;q=`Click the target: <b style="font-size:54px">${target}</b>`;opts=shuffle(icons,r)}
else if(id==='word-scramble'){let word=WORDS[Math.floor(r()*WORDS.length)];ans=word;let chars=word.split('');for(let i=chars.length-1;i>0;i--){let j=Math.floor(r()*(i+1));[chars[i],chars[j]]=[chars[j],chars[i]]}q=`Unscramble: <b>${chars.join('')}</b>`;opts=shuffle([word,WORDS[(WORDS.indexOf(word)+1)%WORDS.length],WORDS[(WORDS.indexOf(word)+2)%WORDS.length],WORDS[(WORDS.indexOf(word)+3)%WORDS.length]],r)}
else{let n=2+Math.floor(r()*8);ans=n;q=`If ${n} friends each have 2 apples, how many apples are there?`;opts=[ans*2,ans,ans+2,ans+4];}
return {q,ans,opts:shuffle([...new Set(opts)],r).slice(0,4)} }
function startMatch(local=true){if(started)return;started=true;round=0;progress=0;opp=0;combo=0;document.getElementById('game').style.display='block';if(local)sb.from('mm_rooms').update({status:'PLAYING'}).eq('id',room.id);setTimeout(nextRound,local?3200:500)}
function nextRound(){if(round>=10){finish();return}round++;let d=roundData(),startedAt=performance.now();document.getElementById('game').innerHTML=`<h2>${gameName(room.game_type)} <span class="tag">Round ${round}/10</span></h2><div class="race"><div class="track"></div><div class="runner" style="left:${progress}%">🏃</div><div class="runner b" style="left:${opp}%">🏃</div></div><div class="q">${d.q}</div><div class="choices">${d.opts.map(x=>`<button class="btn choice" onclick="answer(${JSON.stringify(x)},${JSON.stringify(d.ans)},${startedAt})">${x}</button>`).join('')}</div><p id="raceStatus">YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}% • Combo ${combo}</p>`}
async function answer(v,ans,t){let ok=String(v)===String(ans),ms=Math.round(performance.now()-t);combo=ok?combo+1:0;let boost=ok?Math.max(5,11-Math.floor(ms/500)):1;progress=Math.min(100,progress+boost);await send('answer',{ok,time:ms,progress:boost,round});renderRace();setTimeout(()=>{if(progress>=100)finish();else nextRound()},350)}
function renderRace(){let r=document.querySelector('.runner'),o=document.querySelector('.runner.b');if(r)r.style.left=progress+'%';if(o)o.style.left=opp+'%';let s=document.getElementById('raceStatus');if(s)s.textContent=`YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}% • Combo ${combo}`}
async function finish(){if(!started)return;started=false;let winner=progress>=100&&progress>=opp;await send('finish',{progress});await sb.from('mm_rooms').update({status:'FINISHED'}).eq('id',room.id);document.getElementById('game').innerHTML=`<h1>${winner?'🏆 YOU WIN':'🏁 MATCH COMPLETE'}</h1><p>${gameName(room.game_type)} • Final progress: YOU ${Math.round(progress)}% • OPPONENT ${Math.round(opp)}%</p><button class="btn primary" onclick="location.reload()">REMATCH</button>`}
function show(x){document.getElementById('status').textContent=x}renderGames();ready();
</script></body></html>
