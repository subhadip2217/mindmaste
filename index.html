<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Master — Brain Training</title><style>*{box-sizing:border-box}body{margin:0;background:#04050a;color:#f5f5fb;font:15px Inter,system-ui,sans-serif}body:before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(circle at 15% 15%,#7c3aed38,transparent 28%),radial-gradient(circle at 85% 25%,#06b6d426,transparent 27%),radial-gradient(circle at 50% 90%,#ec48991d,transparent 32%)}.wrap{max-width:1200px;margin:auto;padding:30px 18px 70px}.hero{text-align:center;padding:20px 0 28px}.orb{width:82px;height:82px;margin:auto;border-radius:50%;background:radial-gradient(circle,#fff 5%,#c4b5fd 20%,#7c3aed 45%,#06b6d4 65%,transparent 72%);box-shadow:0 0 35px #8b5cf6aa,0 0 90px #06b6d455;animation:p 3s infinite}.eyebrow{letter-spacing:5px;color:#9995a8;font-size:11px;margin-top:18px}.hero h1{font-size:clamp(45px,9vw,82px);letter-spacing:-5px;margin:7px 0;background:linear-gradient(100deg,#fff,#c4b5fd,#67e8f9);-webkit-background-clip:text;color:transparent}.hero p{color:#aaa7b7}.stats,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0 25px}.stat,.action{padding:10px 15px;border:1px solid #ffffff14;background:#ffffff08;border-radius:13px;color:#aaa7b7}.stat b{color:#fff}.action{color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.card{position:relative;min-height:190px;padding:21px;border:1px solid #ffffff13;border-radius:21px;background:#ffffff08;cursor:pointer;transition:.25s}.card:hover{transform:translateY(-5px);border-color:#a78bfa66;box-shadow:0 15px 45px #0009}.icon{font-size:34px}.tag{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:99px;background:#8b5cf61c;color:#cbbdff;font-size:10px}.card h3{margin:10px 0 5px}.card p{color:#85818f;font-size:13px;line-height:1.45}.play{position:absolute;right:16px;bottom:15px;padding:7px 11px;border-radius:10px;border:1px solid #ffffff15;background:#ffffff0a;color:#fff}.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:15px;background:#000d;backdrop-filter:blur(15px)}.modal.open{display:flex}.panel{width:min(820px,100%);max-height:92vh;overflow:auto;background:#0b0c13;border:1px solid #ffffff18;border-radius:25px;padding:25px;box-shadow:0 25px 100px #000}.close{float:right;background:#ffffff09;border:1px solid #ffffff15;color:#aaa;padding:8px 11px;border-radius:10px;cursor:pointer}.game{text-align:center;clear:both;padding:18px 5px}.target{font-size:50px;min-height:90px;display:flex;align-items:center;justify-content:center;margin:18px}.btn{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(100deg,#7c3aed,#0891b2);color:#fff;font-weight:750;cursor:pointer}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.choice{min-width:80px}.input{padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#fff;color:#111;font-size:19px;text-align:center}.result{margin:18px;color:#ddd}.memory-grid{display:grid;grid-template-columns:repeat(4,62px);gap:9px;justify-content:center;margin:18px}.memory-grid button{height:62px;border-radius:12px;border:1px solid #ffffff16;background:#ffffff08}.memory-grid .active{background:#7c3aed;box-shadow:0 0 20px #7c3aed99}.dash{display:none}.dash.open{display:block}.meter{height:10px;background:#ffffff0c;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#06b6d4)}.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{padding:15px;border:1px solid #ffffff12;border-radius:15px;background:#ffffff06}.metric b{display:block;font-size:24px;margin-top:4px}.table{width:100%;border-collapse:collapse;margin-top:12px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid #ffffff0d;color:#aaa}.table th{color:#fff}.muted{color:#777383}.footer{text-align:center;color:#555260;margin-top:40px;font-size:12px}@keyframes p{50%{transform:scale(1.07);filter:brightness(1.2)}}@media(max-width:520px){.wrap{padding:20px 13px 50px}.hero h1{letter-spacing:-3px}.grid{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(4,55px)}.memory-grid button{height:55px}}</style></head><body><main class="wrap"><section class="hero"><div class="orb"></div><div class="eyebrow">ADAPTIVE BRAIN TRAINING ARCADE</div><h1>MIND MASTER</h1><p>Train memory. Measure performance. Understand your mind.</p></section><div class="stats"><div class="stat">Level <b id="level">1</b></div><div class="stat">XP <b id="xp">0</b></div><div class="stat">Best <b id="best">0</b></div><div class="stat">Streak <b id="streak">0</b> 🔥</div></div><div class="actions"><button class="action" onclick="showDash()">📊 Deep Analysis</button><button class="action" onclick="resetStats()">Reset Local Data</button></div><section class="grid" id="games"></section><div class="footer">Mind Master • Analysis is stored locally on this device</div></main><div class="modal" id="modal"><div class="panel"><button class="close" onclick="closeGame()">✕</button><div class="game" id="game"></div></div></div><div class="modal" id="dashModal"><div class="panel"><button class="close" onclick="dashModal.classList.remove('open')">✕</button><div class="dash open" id="dash"></div></div></div><script>
const games=[['🧠','Memory Matrix','Visual memory','Remember highlighted positions.','memory'],['🔢','Number Recall','Working memory','Recall increasingly difficult numbers.','numbers'],['⚡','Reaction Rush','Reaction speed','React to the signal as quickly as possible.','reaction'],['🧩','Logic Lab','Logical reasoning','Deduction, odd-one-out and rule-based reasoning.','logic'],['🔍','Focus Hunt','Attention','Find the unique symbol.','focus'],['🔄','Sequence Master','Pattern recognition','Predict the next item in a changing numerical pattern.','sequence'],['🎯','Target Shift','Attention switching','Identify the displayed target.','target'],['🧮','Quick Math','Mental calculation','Solve calculations under pressure.','math'],['🧱','Spatial Master','Spatial reasoning','Mentally rotate directions.','spatial']];
const KEY='mmAnalyticsV2',old=JSON.parse(localStorage.getItem(KEY)||'null')||{rounds:[],sessions:0};let A=old,xp=+localStorage.mmXP||0,best=+localStorage.mmBest||0,streak=+localStorage.mmStreak||0,roundStart=0,currentType='',currentTitle='';const $=id=>document.getElementById(id),modal=$('modal'),game=$('game'),dashModal=$('dashModal');function save(){localStorage.mmXP=xp;localStorage.mmBest=best;localStorage.mmStreak=streak;localStorage.setItem(KEY,JSON.stringify(A));$('xp').textContent=xp;$('best').textContent=best;$('streak').textContent=streak;$('level').textContent=Math.floor(xp/100)+1}save();$('games').innerHTML=games.map(g=>`<article class="card" onclick="openGame('${g[4]}','${g[1]}','${g[2]}')"><div class="icon">${g[0]}</div><span class="tag">${g[2]}</span><h3>${g[1]}</h3><p>${g[3]}</p><button class="play">Play →</button></article>`).join('');
function openGame(type,title,skill){currentType=type;currentTitle=title;roundStart=performance.now();modal.classList.add('open');game.innerHTML=`<h2>${title}</h2><p class="muted">${skill} • Adaptive difficulty level ${Math.floor(xp/100)+1}</p><div id="playarea"></div>`;window[type]()}function closeGame(){modal.classList.remove('open')}function beginRound(){roundStart=performance.now()}function record(correct,score,extra={}){const ms=Math.round(performance.now()-roundStart),r={game:currentTitle,type:currentType,correct,time:ms,score,date:Date.now(),...extra};A.rounds.push(r);if(A.rounds.length>500)A.rounds.shift();if(correct){xp+=score;streak++;best=Math.max(best,score)}else{xp+=Math.max(2,score);streak=0}save();return ms}function done(correct,score,extra){return record(correct,score,extra)}
function numbers(){const len=Math.min(5+Math.floor(xp/300),12),n=Array.from({length:len},()=>Math.floor(Math.random()*10)).join(''),a=$('playarea'),show=Math.max(800,1900-len*80);a.innerHTML=`<div class="target">${n}</div><p>Memorize for ${(show/1000).toFixed(1)} seconds...</p>`;setTimeout(()=>{a.innerHTML=`<p>Recall the ${len}-digit number.</p><input id="ans" class="input" inputmode="numeric"><br><br><button class="btn" onclick="checkNum('${n}')">Submit</button>`;beginRound()},show)}function checkNum(n){const ok=$('ans').value===n,ms=done(ok,30,{difficulty:n.length});$('playarea').innerHTML=`<div class="result">${ok?'Correct!':'Incorrect.'}<br>Answer time: <b>${(ms/1000).toFixed(2)}s</b><br>Sequence length: ${n.length}</div><button class="btn" onclick="numbers()">Again</button>`}
function memory(){const count=Math.min(4+Math.floor(xp/400),10),chosen=[];while(chosen.length<count){let i=Math.floor(Math.random()*16);if(!chosen.includes(i))chosen.push(i)}const a=$('playarea');a.innerHTML=`<p>Memorize ${count} glowing tiles...</p><div class="memory-grid" id="mg"></div>`;for(let i=0;i<16;i++){const b=document.createElement('button');b.id='t'+i;$('mg').appendChild(b)}chosen.forEach(i=>$('t'+i).classList.add('active'));setTimeout(()=>{document.querySelectorAll('.memory-grid button').forEach(b=>b.classList.remove('active'));a.insertAdjacentHTML('afterbegin','<p>Select the tiles you remember.</p>');document.querySelectorAll('.memory-grid button').forEach(b=>b.onclick=()=>b.classList.toggle('active'));const btn=document.createElement('button');btn.className='btn';btn.textContent='Check';btn.onclick=()=>{const picked=[...document.querySelectorAll('.memory-grid button')].map((b,i)=>b.classList.contains('active')?i:-1).filter(i=>i>=0),ok=picked.length===count&&picked.every(i=>chosen.includes(i)),ms=done(ok,35,{difficulty:count});a.innerHTML=`<div class="result">${ok?'Excellent visual memory!':'Not quite.'}<br>Selection time: <b>${(ms/1000).toFixed(2)}s</b><br>Pattern size: ${count}</div><button class="btn" onclick="memory()">Again</button>`};a.appendChild(btn);beginRound()},Math.max(1000,2000-Math.floor(xp/200)*60))}
function reaction(){const a=$('playarea');a.innerHTML='<p>Wait for the signal...</p>';setTimeout(()=>{a.innerHTML='<button class="btn" id="react">⚡ CLICK NOW!</button>';const t=performance.now();$('react').onclick=()=>{const ms=Math.round(performance.now()-t),score=Math.max(5,120-Math.floor(ms/8));A.rounds.push({game:'Reaction Rush',type:'reaction',correct:true,time:ms,score,date:Date.now()});xp+=score;streak++;best=Math.max(best,score);save();a.innerHTML=`<div class="result">Reaction time: <b>${ms} ms</b><br>Score: +${score} XP</div><button class="btn" onclick="reaction()">Again</button>`}},700+Math.random()*Math.max(700,2400-Math.floor(xp/150)*50))}
function logic(){const lv=Math.floor(xp/250)+1,mode=Math.floor(Math.random()*3),a=$('playarea');beginRound();if(mode===0){const items=['CAT','DOG','HORSE','ROSE'],ans='ROSE';a.innerHTML=`<div class="target" style="font-size:32px">CAT • DOG • HORSE • ROSE</div><p>Which item does NOT belong?</p><div class="choices">${items.sort(()=>Math.random()-.5).map(x=>`<button class="btn choice" onclick="logicAnswer('${x}','${ans}')">${x}</button>`).join('')}</div>`}else if(mode===1){const n=2+Math.floor(Math.random()*Math.min(8,lv+3)),ans=n+2;a.innerHTML=`<div class="target" style="font-size:30px">If A &gt; B and B &gt; C, which is largest?</div><div class="choices">${['A','B','C'].map(x=>`<button class="btn choice" onclick="logicAnswer('${x}','A')">${x}</button>`).join('')}</div>`}else{const ans=lv%2?'C':'B';a.innerHTML=`<div class="target" style="font-size:28px">Only one statement is true:<br>A: ${ans==='A'?'true':'false'} • B: ${ans==='B'?'true':'false'} • C: ${ans==='C'?'true':'false'}</div><p>Choose the true statement.</p><div class="choices">${['A','B','C'].map(x=>`<button class="btn choice" onclick="logicAnswer('${x}','${ans}')">${x}</button>`).join('')}</div>`}}function logicAnswer(v,a){const ok=v===a,ms=done(ok,28,{difficulty:Math.floor(xp/250)+1,skill:'deduction'});$('playarea').innerHTML=`<div class="result">${ok?'Correct reasoning!':'Not quite.'}<br>Answer time: <b>${(ms/1000).toFixed(2)}s</b></div><button class="btn" onclick="logic()">Next Logic Problem</button>`}
function sequence(){const lv=Math.floor(xp/200)+1,type=Math.floor(Math.random()*3),a=$('playarea');let nums,ans;beginRound();if(type===0){const start=2+Math.floor(Math.random()*8),step=2+Math.floor(Math.random()*Math.min(8,lv+2));nums=[start,start+step,start+2*step,start+3*step];ans=start+4*step}else if(type===1){const start=2+Math.floor(Math.random()*6);nums=[start,start*2,start*4,start*8];ans=start*16}else{const start=20+Math.floor(Math.random()*20);nums=[start,start-1,start-3,start-6];ans=start-10}const opts=[ans,ans+1,ans+2,ans-2].sort(()=>Math.random()-.5);a.innerHTML=`<div class="target" style="font-size:32px">${nums.join(' → ')} → ?</div><p>Find the next item. Pattern type: ${type===0?'constant difference':type===1?'multiplication':'decreasing difference'}</p><div class="choices">${opts.map(v=>`<button class="btn choice" onclick="sequenceAnswer(${v},${ans})">${v}</button>`).join('')}</div>`}function sequenceAnswer(v,a){const ok=v===a,ms=done(ok,25,{difficulty:Math.floor(xp/200)+1,skill:'pattern progression'});$('playarea').innerHTML=`<div class="result">${ok?'Pattern solved!':'Not quite.'}<br>Answer time: <b>${(ms/1000).toFixed(2)}s</b></div><button class="btn" onclick="sequence()">Next Sequence</button>`}
function focus(){const n=Math.min(8+Math.floor(xp/250),18),s=Array(n).fill('●'),d=Math.floor(Math.random()*n);s[d]='○';$('playarea').innerHTML=`<p>Find the different symbol among ${n} objects.</p><div class="choices">${s.map((x,i)=>`<button class="btn choice" style="font-size:26px" onclick="focusAnswer(${i},${d})">${x}</button>`).join('')}</div>`;beginRound()}function focusAnswer(i,d){const ok=i===d,ms=done(ok,20,{difficulty:Math.floor(xp/250)+1});$('playarea').innerHTML=`<div class="result">${ok?'Sharp focus!':'Missed it.'}<br>Answer time: <b>${(ms/1000).toFixed(2)}s</b></div><button class="btn" onclick="focus()">Again</button>`}
function target(){const set=['▲','■','●','◆'],correct=set[Math.floor(Math.random()*4)],options=[correct,...set.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,2)];$('playarea').innerHTML=`<div class="target">${correct}</div><p>Select the same target.</p><div class="choices">${options.sort(()=>Math.random()-.5).map(x=>`<button class="btn choice" style="font-size:28px" onclick="targetAnswer('${x}','${correct}')">${x}</button>`).join('')}</div>`;beginRound()}function targetAnswer(v,c){const ok=v===c,ms=done(ok,18,{difficulty:4});$('playarea').innerHTML=`<div class="result">${ok?'Target locked!':'Wrong target.'}<br>Answer time: <b>${(ms/1000).toFixed(2)}s</b></div><button class="btn" onclick="target()">Again</button>`}
function math(){const lv=Math.floor(xp/200)+1,a=Math.floor(Math.random()*(8+lv))+2,b=Math.floor(Math.random()*(7+lv))+2,ans=a*b,op=[ans,ans+Math.ceil(b/2),ans-b].sort(()=>Math.random()-.5);$('playarea').innerHTML=`<div class="target" style="font-size:38px">${a} × ${b} = ?</div><div class="choices">${op.map(v=>`<button class="btn choice" onclick="mathAnswer(${v},${ans})">${v}</button>`).join('')}</div>`;beginRound()}function mathAnswer(v,a){const ok=v===a,ms=done(ok,20,{difficulty:Math.floor(xp/200)+1});$('playarea').innerHTML=`<div class="result">${ok?'Correct calculation!':'Incorrect.'}<br>Answer time: <b>${(ms/1000).toFixed(2)}s</b></div><button class="btn" onclick="math()">Next</button>`}
function spatial(){const d=['↑','→','↓','←'],s=Math.floor(Math.random()*4),n=d[(s+2)%4],ans=d[s];$('playarea').innerHTML=`<div class="target">${d[s]} → ${n} → ?</div><p>It rotates 180° each step.</p><div class="choices">${d.map(x=>`<button class="btn choice" style="font-size:25px" onclick="spatialAnswer('${x}','${ans}')">${x}</button>`).join('')}</div>`;beginRound()}function spatialAnswer(v,a){const ok=v===a,ms=done(ok,22,{difficulty:4});$('playarea').innerHTML=`<div class="result">${ok?'Correct rotation!':'Keep practicing.'}<br>Answer time: <b>${(ms/1000).toFixed(2)}s</b></div><button class="btn" onclick="spatial()">Next</button>`}
function showDash(){const r=A.rounds;if(!r.length){$('dash').innerHTML='<h2>📊 Deep Performance Analysis</h2><p class="muted">Play some rounds first. Mind Master will build your personal performance profile here.</p>';dashModal.classList.add('open');return}const avg=r.reduce((s,x)=>s+x.time,0)/r.length,acc=r.filter(x=>x.correct).length/r.length*100,recent=r.slice(-20),recentAcc=recent.filter(x=>x.correct).length/recent.length*100,groups={};r.forEach(x=>{groups[x.game]??=[];groups[x.game].push(x)});const rows=Object.entries(groups).map(([g,v])=>{const ac=v.filter(x=>x.correct).length/v.length*100,av=v.reduce((s,x)=>s+x.time,0)/v.length;return `<tr><td>${g}</td><td>${v.length}</td><td>${ac.toFixed(0)}%</td><td>${(av/1000).toFixed(2)}s</td><td>${scoreLabel(ac,av)}</td></tr>`}).join(''),fastest=[...r].sort((a,b)=>a.time-b.time)[0];$('dash').innerHTML=`<h2>📊 Deep Performance Analysis</h2><p class="muted">Based on ${r.length} recorded rounds. This is a training profile, not a clinical IQ measurement.</p><div class="metric-grid"><div class="metric">Accuracy<b>${acc.toFixed(1)}%</b></div><div class="metric">Avg answer time<b>${(avg/1000).toFixed(2)}s</b></div><div class="metric">Recent accuracy<b>${recentAcc.toFixed(1)}%</b></div><div class="metric">Fastest response<b>${fastest.time<1000?fastest.time+' ms':(fastest.time/1000).toFixed(2)+'s'}</b></div><div class="metric">Rounds<b>${r.length}</b></div><div class="metric">Level<b>${Math.floor(xp/100)+1}</b></div></div><h3>Skill profile</h3><table class="table"><tr><th>Game</th><th>Rounds</th><th>Accuracy</th><th>Avg time</th><th>Profile</th></tr>${rows}</table><h3>🧠 What the data suggests</h3><p>${analysisText(r,acc,avg)}</p><h3>📈 Recent trend</h3><div class="metric">Last 20 accuracy<div class="meter"><i style="width:${recentAcc}%"></i></div><br>${recentAcc.toFixed(0)}% correct</div>`;dashModal.classList.add('open')}function scoreLabel(ac,t){if(ac>=90&&t<1800)return'Elite speed';if(ac>=85)return'Strong';if(ac>=70)return'Building';return'Needs practice'}function analysisText(r,acc,avg){const fastest=[...r].sort((a,b)=>a.time-b.time)[0],slow=[...r].sort((a,b)=>b.time-a.time)[0];let text=acc>=90?'Excellent accuracy suggests strong consistency. ':acc>=75?'Your accuracy is solid, with room to improve consistency. ':'Accuracy is the main opportunity right now. ';text+=avg<1800?'Your overall response speed is quick. ':avg<3500?'Your response speed is moderate. ':'Take time to maintain accuracy, then gradually practice faster decisions. ';return text+`Fastest response: ${fastest.time} ms in ${fastest.game}. Slowest: ${slow.time} ms in ${slow.game}.`}
function resetStats(){if(confirm('Reset Mind Master XP and analysis history?')){localStorage.removeItem(KEY);localStorage.removeItem('mmXP');localStorage.removeItem('mmBest');localStorage.removeItem('mmStreak');location.reload()}}modal.addEventListener('click',e=>{if(e.target===modal)closeGame()});dashModal.addEventListener('click',e=>{if(e.target===dashModal)dashModal.classList.remove('open')});</script></body></html>
