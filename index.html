<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Master</title><style>*{box-sizing:border-box}body{margin:0;background:#03050b;color:#f8faff;font:15px system-ui;min-height:100vh;background-image:radial-gradient(circle at 15% 10%,#7c3aed33,transparent 30%),radial-gradient(circle at 85% 20%,#06b6d422,transparent 30%)}.wrap{max-width:1200px;margin:auto;padding:25px}.hero{text-align:center;padding:25px}.orb{width:80px;height:80px;margin:auto;border-radius:50%;background:radial-gradient(circle,#fff,#c4b5fd 15%,#8b5cf6 45%,#22d3ee 68%,transparent 72%);box-shadow:0 0 45px #8b5cf6aa;animation:p 3s infinite}.hero h1{font-size:clamp(45px,9vw,82px);margin:8px 0;letter-spacing:-5px;background:linear-gradient(90deg,#fff,#c4b5fd,#67e8f9);color:transparent;background-clip:text}.muted{color:#8992a7}.stats,.actions,.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.stat,.btn,.card,.panel{border:1px solid #ffffff16;background:#ffffff08;border-radius:15px}.stat{padding:11px 17px;color:#9ca3b8}.stat b{display:block;color:white;font-size:20px}.btn{color:white;padding:11px 17px;cursor:pointer;font-weight:700}.primary{background:linear-gradient(100deg,#7c3aed,#0891b2);border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:20px}.card{padding:20px;min-height:175px;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#67e8f966}.icon{font-size:34px}.tag{font-size:10px;color:#c4b5fd;background:#8b5cf61c;padding:5px 9px;border-radius:99px}.card h3{margin:10px 0 5px}.card p{color:#8992a7}.modal{position:fixed;inset:0;background:#000d;backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.open{display:flex}.panel{width:min(850px,100%);max-height:94vh;overflow:auto;padding:25px}.close{float:right}.game{text-align:center;clear:both;padding:15px}.target{font-size:42px;min-height:75px;display:flex;align-items:center;justify-content:center;margin:18px}.choice{min-width:90px}.input{padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#fff;color:#111;font-size:18px}.memory{display:grid;grid-template-columns:repeat(4,60px);gap:8px;justify-content:center}.memory button{height:60px;background:#ffffff08;border:1px solid #ffffff15;border-radius:10px}.memory .lit{background:#8b5cf6;box-shadow:0 0 20px #8b5cf6}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.metric{padding:15px;background:#ffffff06;border:1px solid #ffffff12;border-radius:14px}.metric b{display:block;font-size:25px}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:8px;border-bottom:1px solid #ffffff10;text-align:left}@keyframes p{50%{transform:scale(1.08)}}@media(max-width:600px){.wrap{padding:12px}.memory{grid-template-columns:repeat(4,52px)}.memory button{height:52px}}</style></head><body><main class="wrap"><header class="hero"><div class="orb"></div><div class="muted">ADAPTIVE BRAIN TRAINING ARCADE</div><h1>MIND MASTER</h1><p class="muted">Train your mind. Challenge your edge.</p><div class="stats"><div class="stat">Level<b id="level">1</b></div><div class="stat">XP<b id="xp">0</b></div><div class="stat">Mind Score<b id="score">0</b></div><div class="stat">Streak<b id="streak">0</b> 🔥</div></div><div class="actions"><button class="btn primary" onclick="analysis()">📊 Deep Analysis</button><button class="btn" onclick="openBattle()">⚔️ 1v1 Battle</button><button class="btn" onclick="resetData()">Reset Data</button></div></header><section class="grid" id="games"></section></main><div class="modal" id="modal"><div class="panel"><button class="btn close" onclick="closeM()">✕</button><div class="game" id="game"></div></div></div><script>
const G=[['🧠','Memory Matrix','Memory','Visual sequence recall','memory'],['🔢','Number Recall','Memory','Working-memory digits','numbers'],['⚡','Reaction Rush','Reaction','Reaction speed and consistency','reaction'],['🧩','Logic Lab','Logic','Fresh deduction problems every round','logic'],['🔍','Focus Hunt','Attention','Find the unique target','focus'],['🔄','Sequence Master','Pattern','Discover changing sequences','sequence'],['🎯','Target Shift','Flexibility','Adapt to changing rules','target'],['🧮','Quick Math','Calculation','Adaptive mental arithmetic','math'],['🧱','Spatial Master','Spatial','Mental rotation and directions','spatial']];let D=JSON.parse(localStorage.mmMaster||'{"xp":0,"streak":0,"rounds":[]}'),start=0,type='',title='';const $=x=>document.getElementById(x);function save(){localStorage.mmMaster=JSON.stringify(D);$('xp').textContent=D.xp;$('level').textContent=Math.floor(D.xp/100)+1;$('streak').textContent=D.streak;let s=D.rounds.length?Math.round(D.rounds.filter(x=>x.ok).length/D.rounds.length*100):0;$('score').textContent=s}save();$('games').innerHTML=G.map(g=>`<article class="card" onclick="openG('${g[4]}','${g[1]}','${g[2]}')"><div class="icon">${g[0]}</div><span class="tag">${g[2]}</span><h3>${g[1]}</h3><p>${g[3]}</p></article>`).join('');function openG(t,n,s){type=t;title=n;$('modal').classList.add('open');$('game').innerHTML=`<h2>${n}</h2><p class="muted">${s} • Adaptive level ${Math.floor(D.xp/100)+1}</p><div id="play"></div>`;window[t]()}function closeM(){$('modal').classList.remove('open')}function openBattle(){window.location.assign('./multiplayer.html')}function begin(){start=performance.now()}function rec(ok,extra={}){let ms=Math.round(performance.now()-start),r={game:title,type,ok,time:ms,date:Date.now(),...extra};D.rounds.push(r);if(D.rounds.length>500)D.rounds.shift();D.xp+=ok?25:3;D.streak=ok?D.streak+1:0;save();return ms}function result(ok,ms,text){$('play').innerHTML=`<div class="target">${ok?'✅':'❌'}</div><p>${text}<br><b>${ms} ms</b></p><button class="btn primary" onclick="${type}()">Next</button>`}
function memory(){let n=Math.min(3+Math.floor(D.xp/250),10),a=[];while(a.length<n){let x=Math.floor(Math.random()*16);if(!a.includes(x))a.push(x)}$('play').innerHTML=`<p>Memorize ${n} random tiles.</p><div class="memory" id="mg"></div>`;for(let i=0;i<16;i++)$('mg').innerHTML+=`<button id="m${i}"></button>`;a.forEach(i=>$('m'+i).classList.add('lit'));setTimeout(()=>{document.querySelectorAll('.memory button').forEach(x=>x.classList.remove('lit'));document.querySelectorAll('.memory button').forEach(x=>x.onclick=()=>x.classList.toggle('lit'));$('play').insertAdjacentHTML('beforeend','<br><br><button class="btn primary" id="check">Check</button>');begin();$('check').onclick=()=>{let p=[...document.querySelectorAll('.memory button')].map((x,i)=>x.classList.contains('lit')?i:-1).filter(x=>x>=0),ok=p.length===n&&p.every(x=>a.includes(x)),ms=rec(ok,{difficulty:n});result(ok,ms,ok?'Perfect recall!':'Pattern missed.')};},Math.max(800,2200-D.xp/3))}
function numbers(){let n=Math.min(5+Math.floor(D.xp/300),12),v=Array.from({length:n},()=>Math.floor(Math.random()*10)).join(''),show=Math.max(700,1900-n*70);$('play').innerHTML=`<div class="target">${v}</div><p>Memorize...</p>`;setTimeout(()=>{$('play').innerHTML=`<p>Enter the ${n}-digit number.</p><input class="input" id="num"><br><br><button class="btn primary" onclick="checkNum('${v}')">Submit</button>`;begin()},show)}function checkNum(v){let ok=$('num').value===v,ms=rec(ok,{length:v.length});result(ok,ms,ok?'Correct recall!':'Incorrect number.')}
function reaction(){let wait=600+Math.random()*2200;$('play').innerHTML='<p>Wait… do not click early.</p>';setTimeout(()=>{$('play').innerHTML='<button class="btn primary" id="go" style="font-size:25px">⚡ GO</button>';let t=performance.now();$('go').onclick=()=>{let ms=Math.round(performance.now()-t);D.rounds.push({game:title,type,ok:true,time:ms,date:Date.now()});D.xp+=Math.max(5,120-Math.floor(ms/8));D.streak++;save();result(true,ms,`Reaction: ${ms} ms`)}},wait)}
function logic(){let bank=[['Which does NOT belong? CAT • DOG • HORSE • ROSE','ROSE',['CAT','DOG','HORSE','ROSE']],['If A > B and B > C, which is smallest?','C',['A','B','C']],['All Zibs are Lums. No Lums are Reds. Can a Zib be Red?','NO',['YES','NO']],['Mia is older than Raj. Raj is older than Sam. Who is youngest?','SAM',['MIA','RAJ','SAM']],['Which is the odd one out? 2, 3, 5, 9, 11','9',['2','5','9','11']],['Every Nox is blue. Some blue things are round. Must every Nox be round?','NO',['YES','NO']],['A box has only red balls. Can you draw a blue ball from it?','NO',['YES','NO']],['Tom finished before Ana. Ana finished before Leo. Who finished last?','LEO',['TOM','ANA','LEO']]];let z=bank[Math.floor(Math.random()*bank.length)];mcq(z[0],z[1],z[2],'Logic')}
function mcq(q,ans,opts,kind){begin();$('play').innerHTML=`<div class="target" style="font-size:25px">${q}</div><div class="choices">${opts.sort(()=>Math.random()-.5).map(x=>`<button class="btn choice" onclick="pick(${JSON.stringify(x)},${JSON.stringify(ans)},${JSON.stringify(kind)})">${x}</button>`).join('')}</div>`}function pick(v,a,k){let ok=v===a,ms=rec(ok,{category:k});result(ok,ms,ok?'Correct reasoning!':'Not quite.')}
function sequence(){let t=Math.floor(Math.random()*6),a=[],ans;if(t===0){let s=2+Math.floor(Math.random()*9),d=1+Math.floor(Math.random()*7);a=[s,s+d,s+2*d,s+3*d];ans=s+4*d}else if(t===1){let s=2+Math.floor(Math.random()*5);a=[s,s*2,s*4,s*8];ans=s*16}else if(t===2){let s=20+Math.floor(Math.random()*20);a=[s,s-1,s-3,s-6];ans=s-10}else if(t===3){let s=2+Math.floor(Math.random()*5);a=[s,s+3,s+8,s+15];ans=s+24}else if(t===4){let s=2+Math.floor(Math.random()*5);a=[s,s+1,s+4,s+9];ans=s+16}else{let s=3+Math.floor(Math.random()*5);a=[s,s*s,(s+1)*(s+1),(s+2)*(s+2)];ans=(s+3)*(s+3)}mcq(a.join(' → ')+' → ?',String(ans),[String(ans),String(ans+1),String(ans+2),String(ans-2)],'Sequence')}
function focus(){let n=Math.min(8+Math.floor(D.xp/180),24),special=Math.floor(Math.random()*n);$('play').innerHTML='<p>Find the different symbol.</p><div class="choices">'+Array.from({length:n},(_,i)=>`<button class="btn choice" onclick="focusPick(${i},${special})">${i===special?'○':'●'}</button>`).join('')+'</div>';begin()}function focusPick(i,s){let ok=i===s,ms=rec(ok,{items:document.querySelectorAll('.choice').length});result(ok,ms,ok?'Target found!':'Missed target.')}
function target(){let rules=[['RED','Select RED'],['BLUE','Select BLUE'],['GREEN','Select GREEN'],['CIRCLE','Select CIRCLE'],['TRIANGLE','Select TRIANGLE']];let r=rules[Math.floor(Math.random()*rules.length)];mcq(r[1],r[0],rules.map(x=>x[0]),'Target Shift')}
function math(){let lv=Math.floor(D.xp/100)+1,a=2+Math.floor(Math.random()*(8+lv)),b=2+Math.floor(Math.random()*(6+lv)),ops=['+','−','×'],op=ops[Math.floor(Math.random()*Math.min(3,1+Math.floor(lv/3)))],ans=op==='+'?a+b:op==='−'?a-b:a*b;mcq(`${a} ${op} ${b} = ?`,String(ans),[String(ans),String(ans+2),String(ans-2),String(ans+b)],'Math')}
function spatial(){let d=['↑','→','↓','←'],x=Math.floor(Math.random()*4),rot=[1,2,3][Math.floor(Math.random()*3)],ans=d[(x+rot)%4];mcq(`${d[x]} rotated ${rot*90}° = ?`,ans,d,'Spatial')}
function analysis(){let h=D.rounds,avg=h.length?Math.round(h.reduce((s,x)=>s+x.time,0)/h.length):0,acc=h.length?Math.round(h.filter(x=>x.ok).length/h.length*100):0,by={};h.forEach(x=>{by[x.game]??={n:0,ok:0,t:0};by[x.game].n++;by[x.game].ok+=x.ok;by[x.game].t+=x.time});$('game').innerHTML=`<h2>📊 Deep Analysis</h2><div class="metrics"><div class="metric">Accuracy<b>${acc}%</b></div><div class="metric">Avg time<b>${avg} ms</b></div><div class="metric">Rounds<b>${h.length}</b></div><div class="metric">Level<b>${Math.floor(D.xp/100)+1}</b></div></div><h3>Game-by-game</h3><table class="table"><tr><th>Game</th><th>Accuracy</th><th>Avg time</th></tr>${Object.entries(by).map(([k,v])=>`<tr><td>${k}</td><td>${Math.round(v.ok/v.n*100)}%</td><td>${Math.round(v.t/v.n)} ms</td></tr>`).join('')}</table><p class="muted">Mind Score is a training metric, not a clinical IQ measurement.</p>`;$('modal').classList.add('open')}function resetData(){if(confirm('Reset Mind Master progress?')){localStorage.removeItem('mmMaster');location.reload()}}
</script></body></html>
