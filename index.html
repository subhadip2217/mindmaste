<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mind Master — Brain Training Arcade</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#04050a;color:#f7f7fb;font-family:Inter,system-ui,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:-25%;z-index:-2;background:radial-gradient(circle at 15% 15%,#7c3aed30,transparent 27%),radial-gradient(circle at 85% 25%,#06b6d425,transparent 25%),radial-gradient(circle at 50% 95%,#ec48991c,transparent 30%)}.wrap{width:min(1200px,100%);margin:auto;padding:34px 20px 70px}.hero{text-align:center;padding:25px 0 35px}.orb{width:82px;height:82px;margin:auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 7%,#c4b5fd 18%,#7c3aed 43%,#06b6d4 62%,transparent 72%);box-shadow:0 0 30px #8b5cf6aa,0 0 90px #06b6d455;animation:pulse 3s ease-in-out infinite}.eyebrow{margin-top:20px;letter-spacing:5px;font-size:11px;color:#9d9aaa}.hero h1{font-size:clamp(46px,9vw,82px);margin:8px 0;background:linear-gradient(100deg,#fff,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-5px}.hero p{margin:0;color:#aaa7b7;font-size:16px}.stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 35px}.stat{padding:10px 16px;border:1px solid #ffffff12;background:#ffffff08;border-radius:14px;color:#a9a5b5}.stat b{color:#fff}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.section-head h2{margin:0;font-size:24px}.section-head span{color:#777383;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(225px,1fr));gap:15px}.card{position:relative;min-height:195px;padding:21px;border-radius:21px;border:1px solid #ffffff12;background:linear-gradient(145deg,#ffffff0c,#ffffff03);cursor:pointer;overflow:hidden;transition:.25s}.card:hover{transform:translateY(-5px);border-color:#a78bfa66;box-shadow:0 18px 50px #0009,0 0 30px #8b5cf622}.icon{font-size:34px}.tag{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:99px;background:#8b5cf61a;color:#cbbdff;font-size:10px}.card h3{margin:11px 0 5px}.card p{margin:0;color:#85818f;font-size:13px;line-height:1.45}.play{position:absolute;right:17px;bottom:16px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;border-radius:10px;padding:7px 11px}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#000c;backdrop-filter:blur(14px)}.modal.open{display:flex}.panel{width:min(680px,100%);max-height:90vh;overflow:auto;border:1px solid #ffffff18;background:#0b0c13;border-radius:25px;padding:26px;box-shadow:0 25px 100px #000}.close{float:right;border:1px solid #ffffff15;background:#ffffff0a;color:#aaa;border-radius:10px;padding:8px 11px;cursor:pointer}.game{text-align:center;clear:both;padding:20px 5px 8px}.game h2{font-size:29px;margin:5px}.sub{color:#888494}.target{font-size:54px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:22px 0}.btn{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(100deg,#7c3aed,#0891b2);color:white;font-weight:750;cursor:pointer;box-shadow:0 7px 25px #0006}.choices{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.choice{min-width:85px}.input{padding:12px;border-radius:11px;border:1px solid #ffffff22;background:#fff;color:#111;font-size:19px;text-align:center;max-width:100%}.result{margin:18px 0;color:#d6d1df;font-size:17px}.memory-grid{display:grid;grid-template-columns:repeat(4,65px);gap:9px;justify-content:center;margin:20px auto}.memory-grid button{height:65px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;cursor:pointer}.memory-grid button.active{background:#7c3aed;box-shadow:0 0 20px #7c3aed88}.footer{text-align:center;color:#565260;font-size:12px;margin-top:45px}@keyframes pulse{50%{transform:scale(1.07);filter:brightness(1.2)}}@media(max-width:520px){.wrap{padding:22px 14px 50px}.hero h1{letter-spacing:-3px}.grid{grid-template-columns:1fr}.memory-grid{grid-template-columns:repeat(4,58px)}.memory-grid button{height:58px}}
</style></head><body><main class="wrap"><section class="hero"><div class="orb"></div><div class="eyebrow">BRAIN TRAINING ARCADE</div><h1>MIND MASTER</h1><p>Train memory. Sharpen focus. Challenge your mind.</p></section><div class="stats"><div class="stat">Level <b id="level">1</b></div><div class="stat">XP <b id="xp">0</b></div><div class="stat">Best <b id="best">0</b></div><div class="stat">Streak <b id="streak">0</b> 🔥</div></div><div class="section-head"><h2>Choose your challenge</h2><span>9 training modes</span></div><section class="grid" id="games"></section><div class="footer">Mind Master • Progress is saved locally in your browser</div></main><div class="modal" id="modal"><div class="panel"><button class="close" onclick="closeGame()">✕</button><div class="game" id="game"></div></div></div><script>
const games=[['🧠','Memory Matrix','Visual memory','Remember the highlighted tiles and reproduce the pattern.','memory'],['🔢','Number Recall','Working memory','Memorize a number, then recall it after a short delay.','numbers'],['⚡','Reaction Rush','Reaction','Wait for the signal and react as quickly as you can.','reaction'],['🧩','Logic Lab','Reasoning','Solve changing logic sequences and earn points.','logic'],['🔍','Focus Hunt','Attention','Find the one different symbol among similar targets.','focus'],['🔄','Sequence Master','Pattern recognition','Complete the next item in a number sequence.','sequence'],['🎯','Target Shift','Attention switching','Follow the target rule and select the correct symbol.','target'],['🧮','Quick Math','Mental calculation','Solve fast calculations with increasing difficulty.','math'],['🧱','Spatial Master','Spatial reasoning','Mentally rotate a shape and choose its next orientation.','spatial']];
let xp=Number(localStorage.mmXP||0),best=Number(localStorage.mmBest||0),streak=Number(localStorage.mmStreak||0);function save(){localStorage.mmXP=xp;localStorage.mmBest=best;localStorage.mmStreak=streak;xpEl.textContent=xp;bestEl.textContent=best;streakEl.textContent=streak;levelEl.textContent=Math.floor(xp/100)+1}const xpEl=document.getElementById('xp'),bestEl=document.getElementById('best'),streakEl=document.getElementById('streak'),levelEl=document.getElementById('level');save();document.getElementById('games').innerHTML=games.map(g=>`<article class="card" onclick="openGame('${g[4]}','${g[1]}','${g[2]}')"><div class="icon">${g[0]}</div><span class="tag">${g[2]}</span><h3>${g[1]}</h3><p>${g[3]}</p><button class="play">Play →</button></article>`).join('');const modal=document.getElementById('modal'),game=document.getElementById('game');function openGame(type,title,skill){modal.classList.add('open');game.innerHTML=`<h2>${title}</h2><p class="sub">${skill}</p><div id="playarea"></div>`;window[type]()}function closeGame(){modal.classList.remove('open')}function award(score){xp+=score;streak++;if(score>best)best=score;save()}function fail(){streak=0;save()}
function numbers(){const n=Math.floor(10000+Math.random()*90000),a=document.getElementById('playarea');a.innerHTML=`<div class="target">${n}</div><p>Memorize it...</p>`;setTimeout(()=>a.innerHTML=`<p>What was the number?</p><input id="ans" class="input" inputmode="numeric"><br><br><button class="btn" onclick="checkNum(${n})">Submit</button>`,1800)}function checkNum(n){const ok=Number(document.getElementById('ans').value)===n;if(ok)award(30);else{award(4);fail()}document.getElementById('playarea').innerHTML=`<div class="result">${ok?'Correct! +30 XP 🎉':'Not quite. The answer was '+n+'.'}</div><button class="btn" onclick="numbers()">Again</button>`}
function memory(){const size=16,count=4,chosen=[];while(chosen.length<count){const i=Math.floor(Math.random()*size);if(!chosen.includes(i))chosen.push(i)}const a=document.getElementById('playarea');a.innerHTML='<p>Memorize the glowing tiles...</p><div class="memory-grid" id="mg"></div>';const grid=document.getElementById('mg');for(let i=0;i<size;i++){const b=document.createElement('button');b.id='t'+i;grid.appendChild(b)}chosen.forEach(i=>document.getElementById('t'+i).classList.add('active'));setTimeout(()=>{document.querySelectorAll('.memory-grid button').forEach(b=>b.classList.remove('active'));a.insertAdjacentHTML('afterbegin','<p>Select the 4 tiles you remember.</p>');document.querySelectorAll('.memory-grid button').forEach((b,i)=>b.onclick=()=>b.classList.toggle('active'));const btn=document.createElement('button');btn.className='btn';btn.textContent='Check';btn.onclick=()=>{const picked=[...document.querySelectorAll('.memory-grid button')].map((b,i)=>b.classList.contains('active')?i:-1).filter(i=>i>=0),ok=picked.length===count&&picked.every(i=>chosen.includes(i));if(ok)award(35);else{award(5);fail()}a.innerHTML=`<div class="result">${ok?'Excellent visual memory! +35 XP 🧠':'Good try — train it again!'}</div><button class="btn" onclick="memory()">Again</button>`};a.appendChild(btn)},1700)}
function reaction(){const a=document.getElementById('playarea');a.innerHTML='<p>Wait for the signal...</p>';setTimeout(()=>{a.innerHTML='<button class="btn" id="react">⚡ CLICK NOW!</button>';const start=performance.now();document.getElementById('react').onclick=()=>{const ms=Math.round(performance.now()-start),score=Math.max(5,120-Math.floor(ms/8));award(score);a.innerHTML=`<div class="result">Reaction time: <b>${ms} ms</b><br>+${score} XP</div><button class="btn" onclick="reaction()">Again</button>`}},900+Math.random()*2600)}
function logic(){const start=Math.floor(Math.random()*8)+2,step=Math.floor(Math.random()*4)+2,ans=start+step*4;document.getElementById('playarea').innerHTML=`<div class="target" style="font-size:34px">${start}, ${start+step}, ${start+step*2}, ${start+step*3}, ?</div><p>What comes next?</p><div class="choices">${[ans,ans+step,ans-1].sort(()=>Math.random()-.5).map(v=>`<button class="btn choice" onclick="logicAnswer(${v},${ans})">${v}</button>`).join('')}</div>`}function logicAnswer(v,a){const ok=v===a;if(ok)award(25);else{award(4);fail()}document.getElementById('playarea').innerHTML=`<div class="result">${ok?'Correct reasoning! +25 XP 🧩':'Not quite. Keep training!'}</div><button class="btn" onclick="logic()">Next</button>`}
function focus(){const s=Array(8).fill('●'),d=Math.floor(Math.random()*8);s[d]='○';document.getElementById('playarea').innerHTML=`<p>Find the different symbol.</p><div class="choices">${s.map((x,i)=>`<button class="btn choice" style="font-size:26px" onclick="focusAnswer(${i},${d})">${x}</button>`).join('')}</div>`}function focusAnswer(i,d){const ok=i===d;if(ok)award(20);else{award(3);fail()}document.getElementById('playarea').innerHTML=`<div class="result">${ok?'Sharp focus! 👁️ +20 XP':'Missed it this time.'}</div><button class="btn" onclick="focus()">Again</button>`}
function sequence(){const a=Math.floor(Math.random()*5)+2,step=Math.floor(Math.random()*5)+2,ans=a+step*4;document.getElementById('playarea').innerHTML=`<div class="target" style="font-size:32px">${a} → ${a+step} → ${a+step*2} → ${a+step*3} → ?</div><div class="choices">${[ans,ans+2,ans-step].sort(()=>Math.random()-.5).map(v=>`<button class="btn choice" onclick="sequenceAnswer(${v},${ans})">${v}</button>`).join('')}</div>`}function sequenceAnswer(v,a){const ok=v===a;if(ok)award(25);else{award(4);fail()}document.getElementById('playarea').innerHTML=`<div class="result">${ok?'Pattern mastered! +25 XP 🔄':'Identify the constant step.'}</div><button class="btn" onclick="sequence()">Next</button>`}
function target(){const set=['▲','■','●','◆'],correct=set[Math.floor(Math.random()*set.length)],options=[correct,...set.filter(x=>x!==correct).sort(()=>Math.random()-.5).slice(0,2)];document.getElementById('playarea').innerHTML=`<div class="target">${correct}</div><p>Select the symbol shown above.</p><div class="choices">${options.sort(()=>Math.random()-.5).map(x=>`<button class="btn choice" style="font-size:28px" onclick="targetAnswer('${x}','${correct}')">${x}</button>`).join('')}</div>`}function targetAnswer(v,c){const ok=v===c;if(ok)award(18);else{award(3);fail()}document.getElementById('playarea').innerHTML=`<div class="result">${ok?'Target locked! +18 XP 🎯':'Wrong target.'}</div><button class="btn" onclick="target()">Again</button>`}
function math(){const lv=Math.floor(xp/200)+1,a=Math.floor(Math.random()*(8+lv))+2,b=Math.floor(Math.random()*(7+lv))+2,ans=a*b,options=[ans,ans+Math.ceil(b/2),ans-b].sort(()=>Math.random()-.5);document.getElementById('playarea').innerHTML=`<div class="target" style="font-size:38px">${a} × ${b} = ?</div><div class="choices">${options.map(v=>`<button class="btn choice" onclick="mathAnswer(${v},${ans})">${v}</button>`).join('')}</div>`}function mathAnswer(v,a){const ok=v===a;if(ok)award(20);else{award(4);fail()}document.getElementById('playarea').innerHTML=`<div class="result">${ok?'Correct calculation! +20 XP 🧮':'Keep your mental arithmetic sharp.'}</div><button class="btn" onclick="math()">Next</button>`}
function spatial(){const dirs=['↑','→','↓','←'],start=Math.floor(Math.random()*4),next=dirs[(start+2)%4],answer=dirs[start];document.getElementById('playarea').innerHTML=`<div class="target">${dirs[start]} → ${next} → ?</div><p>The direction rotates 180° each step.</p><div class="choices">${dirs.map(x=>`<button class="btn choice" style="font-size:25px" onclick="spatialAnswer('${x}','${answer}')">${x}</button>`).join('')}</div>`}function spatialAnswer(v,a){const ok=v===a;if(ok)award(22);else{award(4);fail()}document.getElementById('playarea').innerHTML=`<div class="result">${ok?'Great spatial rotation! +22 XP 🧱':'Rotate the arrow another 180°.'}</div><button class="btn" onclick="spatial()">Next</button>`}
modal.addEventListener('click',e=>{if(e.target===modal)closeGame()});
</script></body></html>
