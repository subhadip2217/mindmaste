<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mind Master — Brain Training</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050509;color:#f5f5fa;font-family:Inter,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 20% 20%,#673cff22,transparent 30%),radial-gradient(circle at 80% 30%,#00d9ff16,transparent 28%),radial-gradient(circle at 50% 90%,#ff3cac12,transparent 35%);z-index:-1}.wrap{max-width:1180px;margin:auto;padding:42px 22px 70px}.hero{text-align:center;padding:34px 0 45px}.orb{width:74px;height:74px;margin:0 auto 20px;border-radius:50%;background:radial-gradient(circle,#fff,#9b6cff 30%,#371b8f 65%,transparent 70%);box-shadow:0 0 35px #8b5cf6aa,0 0 90px #4f46e555;animation:pulse 3s infinite}.eyebrow{letter-spacing:5px;font-size:12px;color:#aaa6bd}.hero h1{font-size:clamp(42px,8vw,78px);margin:10px 0 5px;letter-spacing:-4px;background:linear-gradient(100deg,#fff,#b99aff,#66e6ff);-webkit-background-clip:text;color:transparent}.hero p{color:#a9a6b5;font-size:17px;margin:0}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:30px}.stat{background:#ffffff08;border:1px solid #ffffff12;border-radius:14px;padding:10px 18px;color:#bdb9c8}.stat b{color:#fff}.section-title{display:flex;align-items:end;justify-content:space-between;margin:28px 0 16px}.section-title h2{margin:0;font-size:25px}.section-title span{color:#777383;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:16px}.card{position:relative;overflow:hidden;background:linear-gradient(145deg,#ffffff0b,#ffffff04);border:1px solid #ffffff12;border-radius:22px;padding:22px;min-height:190px;transition:.25s;cursor:pointer}.card:hover{transform:translateY(-5px);border-color:#a78bfa55;box-shadow:0 15px 45px #0008,0 0 25px #8b5cf622}.icon{font-size:34px}.tag{display:inline-block;margin-top:12px;padding:5px 9px;border-radius:99px;background:#8b5cf61a;color:#c8b8ff;font-size:11px}.card h3{margin:12px 0 5px}.card p{margin:0;color:#85818f;font-size:13px;line-height:1.5}.play{position:absolute;right:18px;bottom:18px;border:1px solid #ffffff18;background:#ffffff0c;color:#fff;border-radius:10px;padding:8px 12px}.modal{position:fixed;inset:0;background:#000b;backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.panel{width:min(620px,100%);background:#0d0d14;border:1px solid #ffffff18;border-radius:25px;padding:30px;box-shadow:0 25px 100px #000}.close{float:right;background:#ffffff0a;border:1px solid #ffffff15;color:#aaa;border-radius:10px;padding:8px 12px;cursor:pointer}.game{clear:both;text-align:center;padding:30px 5px 10px}.game h2{font-size:30px}.target{font-size:70px;min-height:100px;display:flex;align-items:center;justify-content:center;margin:20px}.btn{border:0;border-radius:12px;padding:12px 20px;background:linear-gradient(100deg,#7c3aed,#06b6d4);color:#fff;font-weight:700;cursor:pointer}.choices{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.choice{min-width:90px}.result{margin:20px 0;color:#c7c2d3}.footer{text-align:center;color:#555260;font-size:12px;margin-top:45px}@keyframes pulse{50%{transform:scale(1.08);filter:brightness(1.2)}}
</style></head><body><main class="wrap"><section class="hero"><div class="orb"></div><div class="eyebrow">BRAIN TRAINING ARCADE</div><h1>MIND MASTER</h1><p>Train memory. Sharpen focus. Challenge your mind.</p></section><div class="stats"><div class="stat">Level <b id="level">1</b></div><div class="stat">XP <b id="xp">0</b></div><div class="stat">Best Score <b id="best">0</b></div><div class="stat">Streak <b id="streak">0</b> 🔥</div></div><div class="section-title"><h2>Choose your challenge</h2><span>More games coming soon</span></div><section class="grid" id="games"></section><div class="footer">Mind Master • Built for focused, repeatable brain training</div></main><div class="modal" id="modal"><div class="panel"><button class="close" onclick="closeGame()">✕</button><div class="game" id="game"></div></div></div>
<script>
const games=[['🧠','Memory Matrix','Visual memory','Remember the symbol sequence and reproduce it.','memory'],['🔢','Number Recall','Working memory','Memorize a number and recall it after a short pause.','numbers'],['⚡','Reaction Rush','Reaction','Wait for the signal, then react as quickly as possible.','reaction'],['🧩','Logic Lab','Reasoning','Solve quick logic challenges and build your score.','logic'],['🔍','Focus Hunt','Attention','Find the one different symbol before time runs out.','focus'],['🔄','Sequence Master','Patterns','Discover the missing item in an evolving sequence.','sequence'],['🎯','Target Shift','Attention switching','Track the changing target and respond accurately.','target'],['🧮','Quick Math','Mental math','Solve rapid calculations under pressure.','math'],['🧱','Spatial Master','Spatial reasoning','Test your ability to mentally rotate and compare shapes.','spatial']];
let xp=+localStorage.mmXP||0,best=+localStorage.mmBest||0,streak=+localStorage.mmStreak||0;function save(){localStorage.mmXP=xp;localStorage.mmBest=best;localStorage.mmStreak=streak;document.querySelector('#xp').textContent=xp;document.querySelector('#best').textContent=best;document.querySelector('#streak').textContent=streak;document.querySelector('#level').textContent=Math.floor(xp/100)+1}save();
document.querySelector('#games').innerHTML=games.map(g=>`<article class="card" onclick="openGame('${g[4]}','${g[1]}','${g[2]}')"><div class="icon">${g[0]}</div><span class="tag">${g[2]}</span><h3>${g[1]}</h3><p>${g[3]}</p><button class="play">Play →</button></article>`).join('');
const modal=document.querySelector('#modal'),game=document.querySelector('#game');function openGame(type,title,skill){modal.classList.add('open');game.innerHTML=`<h2>${title}</h2><p>${skill}</p><div id="playarea"></div>`;({memory,memory:numbers,numbers, reaction,logic,focus,sequence,target,math,spatial}[type]||numbers)()}function closeGame(){modal.classList.remove('open')}
function award(score){xp+=score;streak++;if(score>best)best=score;save()}
function numbers(){let n=Math.floor(1000+Math.random()*9000),a=document.querySelector('#playarea');a.innerHTML=`<div class="target">${n}</div><p>Memorize it...</p>`;setTimeout(()=>{a.innerHTML='<p>What was the number?</p><input id="ans" style="padding:12px;border-radius:10px;border:1px solid #ffffff22;background:#fff;color:#111;font-size:20px;text-align:center"><br><br><button class="btn" onclick="checkNum(${n})">Submit</button>`},1800)}function checkNum(n){let ok=+document.querySelector('#ans').value===n;document.querySelector('#playarea').innerHTML=`<div class="result">${ok?'Correct! +25 XP 🎉':'Not quite. The answer was '+n+'.'}</div><button class="btn" onclick="numbers()">Again</button>`;award(ok?25:5)}
function memory(){let seq=Array.from({length:4},()=>['◆','●','▲','■'][Math.floor(Math.random()*4)]).join(' '),a=document.querySelector('#playarea');a.innerHTML=`<div class="target">${seq}</div><p>Remember the sequence...</p>`;setTimeout(()=>{a.innerHTML='<p>Type the sequence using spaces:</p><input id="ans" style="padding:12px;width:90%;border-radius:10px;border:1px solid #ffffff22;background:#fff;color:#111;font-size:18px"><br><br><button class="btn" onclick="checkMem(\''+seq+'\')">Submit</button>'},2200)}function checkMem(seq){let ok=document.querySelector('#ans').value.trim()===seq;document.querySelector('#playarea').innerHTML=`<div class="result">${ok?'Perfect recall! +30 XP 🧠':'Good attempt. Try again!'}</div><button class="btn" onclick="memory()">Again</button>`;award(ok?30:5)}
function reaction(){let a=document.querySelector('#playarea');a.innerHTML='<p>Get ready...</p>';let t;setTimeout(()=>{a.innerHTML='<button class="btn" id="react">CLICK!</button>';t=performance.now();document.querySelector('#react').onclick=()=>{let ms=Math.round(performance.now()-t);award(Math.max(5,100-Math.floor(ms/10)));a.innerHTML=`<div class="result">${ms} ms ⚡</div><button class="btn" onclick="reaction()">Again</button>`}},1000+Math.random()*2500)}
function logic(){let x=Math.floor(Math.random()*9)+1,y=x*2+2,a=document.querySelector('#playarea');a.innerHTML=`<div class="target">${x}, ${x+2}, ${x+4}, ?</div><p>What comes next?</p><div class="choices">${[x+6,x+7,x+8].map(v=>`<button class="btn choice" onclick="logicAnswer(${v},${y})">${v}</button>`).join('')}</div>`}function logicAnswer(v,y){let ok=v===y;award(ok?25:5);document.querySelector('#playarea').innerHTML=`<div class="result">${ok?'Correct!':'The pattern was +2.'}</div><button class="btn" onclick="logic()">Next</button>`}
function focus(){let diff=Math.floor(Math.random()*8),arr=Array(8).fill('●');arr[diff]='○';document.querySelector('#playarea').innerHTML=`<div class="target" style="font-size:48px;gap:15px;flex-wrap:wrap">${arr.map((x,i)=>`<button class="btn" onclick="focusAns(${i},${diff})">${x}</button>`).join('')}</div><p>Find the different symbol.</p>`}function focusAns(i,d){let ok=i===d;award(ok?20:3);document.querySelector('#playarea').innerHTML=`<div class="result">${ok?'Sharp eyes! 👁️':'Missed it this time.'}</div><button class="btn" onclick="focus()">Again</button>`}
function sequence(){logic()};function target(){focus()};function math(){let a=Math.floor(Math.random()*20)+5,b=Math.floor(Math.random()*15)+2,ans=a*b;document.querySelector('#playarea').innerHTML=`<div class="target">${a} × ${b} = ?</div><div class="choices">${[ans,ans+2,ans-3].map(v=>`<button class="btn choice" onclick="mathAns(${v},${ans})">${v}</button>`).join('')}</div>`}function mathAns(v,a){let ok=v===a;award(ok?20:4);document.querySelector('#playarea').innerHTML=`<div class="result">${ok?'Correct! +20 XP':'Try another one!'}</div><button class="btn" onclick="math()">Next</button>`}function spatial(){document.querySelector('#playarea').innerHTML='<div class="target">⬆️ → ⬇️ ← ?</div><p>Which direction comes next?</p><div class="choices">'+['⬆️','→','⬇️','←'].map(x=>`<button class="btn choice" onclick="spatialAns('${x}')">${x}</button>`).join('')+'</div>'}function spatialAns(x){let ok=x==='⬆️';award(ok?20:4);document.querySelector('#playarea').innerHTML=`<div class="result">${ok?'Correct rotation! 🧱':'Keep practicing spatial patterns.'}</div><button class="btn" onclick="spatial()">Next</button>`}
</script></body></html>
